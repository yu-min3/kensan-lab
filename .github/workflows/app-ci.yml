name: App CI

on:
  pull_request:
    paths:
      - "apps/kensan/**"
      - "apps/feed/**"
      - "packages/design-tokens/**"
      - ".github/workflows/app-ci.yml"
  push:
    branches: [main]
    paths:
      - "apps/kensan/**"
      - "apps/feed/**"
      - "packages/design-tokens/**"
      - ".github/workflows/app-ci.yml"

jobs:
  backend:
    name: kensan backend (go vet + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/kensan/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/kensan/backend/go.mod
          cache-dependency-path: apps/kensan/backend/go.sum
      - run: go vet ./...
      - run: go test ./...

  feed:
    name: feed (go vet + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/feed
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/feed/go.mod
          cache-dependency-path: apps/feed/go.sum
      - run: go vet ./...
      - run: go test ./...

  frontend:
    name: frontend (tsc + vite build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/kensan/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/kensan/frontend/package-lock.json
      - run: npm ci
      - run: npm test
      # tokens.css は packages/design-tokens から相対 import されるため full checkout 前提
      - run: npm run build

  e2e:
    name: e2e (playwright smoke)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/kensan/backend/go.mod
          cache-dependency-path: apps/kensan/backend/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/kensan/frontend/package-lock.json
      # global-setup が frontend build → Go backend 起動まで面倒を見る
      - run: npm ci
        working-directory: apps/kensan/e2e
      - run: npx playwright install --with-deps chromium
        working-directory: apps/kensan/e2e
      - run: npm test
        working-directory: apps/kensan/e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/kensan/e2e/playwright-report/
          retention-days: 7
