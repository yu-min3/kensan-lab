## Backstage CI.
##
## Until now the developer portal was the one component with no build in CI: the
## image was produced by hand with `make push`, which meant it could only be cut
## from a machine that happened to have the right Node and a warm yarn cache,
## and nothing checked that the source still compiled. That is also why it
## stayed amd64-only long after the applications went multi-arch — building for
## a second architecture on a laptop means emulating one of them.
##
## Two jobs, deliberately split:
##   verify   runs on every pull request. Type-check, test, and build the image
##            for one architecture without pushing. Fast enough to be useful.
##   release  runs only when asked, and produces the multi-arch image. Cutting a
##            version is a decision, not a side effect of merging.
name: Backstage CI

on:
  pull_request:
    paths:
      - "backstage/**"
      # Scaffolder templates are data the portal serves, not code it is built
      # from: changing one cannot break the build, and rebuilding the whole
      # portal to find that out costs three minutes per edit. Template CI
      # covers them instead, by scaffolding and running the result.
      - "!backstage/templates/**"
      - ".github/workflows/backstage-ci.yml"
  push:
    branches: [main]
    paths:
      - "backstage/**"
      - "!backstage/templates/**"
      - ".github/workflows/backstage-ci.yml"
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag to publish (e.g. v0.0.12)"
        required: true
        type: string

concurrency:
  group: backstage-${{ github.ref }}
  cancel-in-progress: true

env:
  # backstage/package.json declares "node": "20 || 22". Pinning the upper bound
  # rather than tracking latest: newer Node breaks the native build of
  # better-sqlite3, which the backend depends on.
  NODE_VERSION: "22"
  # Namespaced under the repository, not just the owner, and that is the point:
  # GHCR links a package to a repository when Actions creates it, and the
  # repository's GITHUB_TOKEN can only push to packages it owns. The older
  # `ghcr.io/<owner>/backstage` was created by a `docker push` from a laptop, so
  # it belongs to no repository and the release job is denied — with no way to
  # connect the two after the fact (the package settings picker only offers
  # repositories for packages Actions already owns).
  #
  # The old package is left alone; production still pulls v0.0.11 from it until
  # somebody chooses to move.
  IMAGE: ghcr.io/${{ github.repository }}/backstage

jobs:
  verify:
    name: verify (type-check, test, image builds)
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backstage
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      # The repository vendors yarn 4.4.1 under .yarn/releases, so corepack is
      # what makes `yarn` resolve to that version rather than whatever ships
      # with Node.
      - name: Enable corepack
        run: corepack enable

      - name: Install
        run: yarn install --immutable

      - run: yarn tsc
      - run: yarn test

      # Builds for one architecture and stops there. The point is to catch a
      # broken Dockerfile or a backend bundle that will not assemble, not to
      # produce an artifact.
      - name: Build backend bundle
        run: yarn workspace backend build

      - name: Build image (no push)
        run: |
          docker build \
            --platform linux/amd64 \
            -f packages/backend/Dockerfile \
            -t backstage:ci \
            .

      # The image builds, and that says nothing about whether it starts.
      #
      # v0.0.15 was published green: yarn tsc passed, the bundle assembled, the
      # image built and pushed, and the container came up listening on 7007 —
      # then aborted plugin initialization on a dependency that only exists at
      # runtime. Every route was missing, so the only signal Kubernetes could
      # give was "Liveness probe failed: 404", nineteen minutes into the cluster
      # job and pointing at the probe rather than at the cause.
      #
      # Thirty seconds here instead. Anything that stops the backend from
      # finishing its startup — a duplicated package, a config that does not
      # load, a migration that fails — fails at the same layer as `yarn tsc`,
      # with the real error in the log.
      - name: Check that the image actually starts
        run: |
          docker network create smoke
          docker run -d --name smoke-db --network smoke \
            -e POSTGRES_USER=postgres -e POSTGRES_PASSWORD=postgres \
            postgres:16-alpine
          until docker exec smoke-db pg_isready -U postgres >/dev/null 2>&1; do sleep 1; done

          # Values a running instance requires but does not use here. The token
          # is deliberately one GitHub will reject: an empty value fails the
          # config type check at startup, which would make this pass or fail for
          # the wrong reason.
          docker run -d --name smoke-app --network smoke -p 7007:7007 \
            -e NODE_ENV=production \
            -e POSTGRES_HOST=smoke-db -e POSTGRES_PORT=5432 \
            -e POSTGRES_USER=postgres -e POSTGRES_PASSWORD=postgres \
            -e GITHUB_TOKEN=ghp_0000000000000000000000000000000000ci \
            -e AUTH_OIDC_CLIENT_ID=ci -e AUTH_OIDC_CLIENT_SECRET=ci \
            -e AUTH_SESSION_SECRET=ci \
            -e GITEA_ADMIN_USERNAME=ci -e GITEA_ADMIN_PASSWORD=ci \
            -e KEYCLOAK_ADMIN_USERNAME=ci -e KEYCLOAK_ADMIN_PASSWORD=ci \
            backstage:ci

          # Locally this takes about 29 seconds; the ceiling is generous because
          # a runner is slower and a false red here is worse than a slow green.
          for _ in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 3 \
              http://localhost:7007/healthcheck || echo 000)
            [ "$code" = 200 ] && break
            sleep 2
          done

          if [ "$code" != 200 ]; then
            echo "::error::the backend never became healthy (last: HTTP $code)"
            echo "--- container log ---"
            docker logs smoke-app 2>&1 | tail -60
            exit 1
          fi

          # Reached only when the routes exist, which is the thing being proved:
          # a backend that aborted initialization answers 404 here too.
          echo "startup completed and /healthcheck answered 200"

      - name: Tear down the check
        if: always()
        run: |
          docker rm -f smoke-app smoke-db >/dev/null 2>&1 || true
          docker network rm smoke >/dev/null 2>&1 || true


  release:
    name: release (multi-arch, pushed)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    defaults:
      run:
        working-directory: backstage
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Enable corepack
        run: corepack enable

      - name: Install
        run: yarn install --immutable

      # The pull request path runs these; this one did not. A manual release
      # could publish code that never compiled, which is not a hypothetical —
      # it is how this job came to need the check below.
      - run: yarn tsc
      - run: yarn test

      - name: Build backend bundle
        run: yarn workspace backend build

      # The same gate the pull request path runs, before anything is pushed.
      #
      # This job skips `verify` entirely — it is the other half of the `if` at
      # the top of this file — so until now a manual release published without a
      # type check, without tests, and without ever starting the thing. That is
      # exactly how v0.0.15 was published broken.
      #
      # Built for one architecture first so there is something to start. The
      # multi-arch build below reuses the layer cache, so this costs a startup
      # rather than a second build.
      - name: Build the image for the check
        run: |
          docker build \
            --platform linux/amd64 \
            -f packages/backend/Dockerfile \
            -t backstage:release-check \
            .

      # The image builds, and that says nothing about whether it starts.
      #
      # v0.0.15 was published green: yarn tsc passed, the bundle assembled, the
      # image built and pushed, and the container came up listening on 7007 —
      # then aborted plugin initialization on a dependency that only exists at
      # runtime. Every route was missing, so the only signal Kubernetes could
      # give was "Liveness probe failed: 404", nineteen minutes into the cluster
      # job and pointing at the probe rather than at the cause.
      #
      # Thirty seconds here instead. Anything that stops the backend from
      # finishing its startup — a duplicated package, a config that does not
      # load, a migration that fails — fails at the same layer as `yarn tsc`,
      # with the real error in the log.
      - name: Check that the image actually starts
        run: |
          docker network create smoke
          docker run -d --name smoke-db --network smoke \
            -e POSTGRES_USER=postgres -e POSTGRES_PASSWORD=postgres \
            postgres:16-alpine
          until docker exec smoke-db pg_isready -U postgres >/dev/null 2>&1; do sleep 1; done

          # Values a running instance requires but does not use here. The token
          # is deliberately one GitHub will reject: an empty value fails the
          # config type check at startup, which would make this pass or fail for
          # the wrong reason.
          docker run -d --name smoke-app --network smoke -p 7007:7007 \
            -e NODE_ENV=production \
            -e POSTGRES_HOST=smoke-db -e POSTGRES_PORT=5432 \
            -e POSTGRES_USER=postgres -e POSTGRES_PASSWORD=postgres \
            -e GITHUB_TOKEN=ghp_0000000000000000000000000000000000ci \
            -e AUTH_OIDC_CLIENT_ID=ci -e AUTH_OIDC_CLIENT_SECRET=ci \
            -e AUTH_SESSION_SECRET=ci \
            -e GITEA_ADMIN_USERNAME=ci -e GITEA_ADMIN_PASSWORD=ci \
            -e KEYCLOAK_ADMIN_USERNAME=ci -e KEYCLOAK_ADMIN_PASSWORD=ci \
            backstage:ci

          # Locally this takes about 29 seconds; the ceiling is generous because
          # a runner is slower and a false red here is worse than a slow green.
          for _ in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 3 \
              http://localhost:7007/healthcheck || echo 000)
            [ "$code" = 200 ] && break
            sleep 2
          done

          if [ "$code" != 200 ]; then
            echo "::error::the backend never became healthy (last: HTTP $code)"
            echo "--- container log ---"
            docker logs smoke-app 2>&1 | tail -60
            exit 1
          fi

          # Reached only when the routes exist, which is the thing being proved:
          # a backend that aborted initialization answers 404 here too.
          echo "startup completed and /healthcheck answered 200"

      - name: Tear down the check
        if: always()
        run: |
          docker rm -f smoke-app smoke-db >/dev/null 2>&1 || true
          docker network rm smoke >/dev/null 2>&1 || true

      # arm64 is emulated on an amd64 runner, which is slow but happens here
      # rather than on somebody's laptop. arm64 matters because the kind explore
      # cluster runs on whatever architecture the visitor has, and Apple Silicon
      # cannot run an amd64 node image — `kind load` accepts it and then
      # silently does not register it.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: backstage
          file: backstage/packages/backend/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.IMAGE }}:${{ inputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Confirm the manifest list
        run: |
          docker buildx imagetools inspect "${IMAGE}:${TAG}" \
            | grep -E 'Platform|Name' || true
        env:
          IMAGE: ${{ env.IMAGE }}
          TAG: ${{ inputs.tag }}
