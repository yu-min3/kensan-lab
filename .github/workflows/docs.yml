name: Deploy docs site

# The build also runs on pull requests: the site used to be validated only after
# a merge, and a docs deploy once stayed broken for a week before anyone noticed
# (#411 → found in #425). Only the deploy job is gated on push to main.
#
# The path filters cover the READMEs pulled in with pymdownx.snippets — an
# architecture page is a one-line transclusion of kubernetes/<domain>/README.md,
# so a change there changes the site without touching docs/. The two lists are
# duplicated because GitHub Actions does not resolve YAML anchors; keep them in
# sync.
on:
  push:
    branches:
      - main
    paths:
      - "docs/**"
      - "kubernetes/**/README.md"
      - "packages/design-tokens/tokens.json"
      - "scripts/diagram-theme.py"
      - "Makefile"
      - "mkdocs.yml"
      - "requirements-docs.txt"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "docs/**"
      - "kubernetes/**/README.md"
      - "packages/design-tokens/tokens.json"
      - "scripts/diagram-theme.py"
      - "Makefile"
      - "mkdocs.yml"
      - "requirements-docs.txt"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-docs.txt

      - name: Install dependencies
        run: pip install -r requirements-docs.txt

      # The light architecture diagram is generated from the dark one; this
      # fails if it was not regenerated, or if the palette lost WCAG AA.
      - name: Verify generated diagrams
        run: make diagrams-verify

      - name: Build site
        run: mkdocs build --strict

      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: ./site

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
