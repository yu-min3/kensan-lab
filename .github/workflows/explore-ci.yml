## Explore CI — stand the platform up on kind and prove it still serves traffic.
##
## The point is not to test kind. It is to notice when a change to the real
## cluster stops being reproducible: a chart bump that needs a node label we
## only have on bare metal, a manifest that grows a dependency on Cilium, a
## values file that assumes Vault. Those show up here as a red build on the pull
## request that caused them, which is the only moment they are cheap to fix.
##
## When this job fails, the first question is "is the production change still
## reproducible?" — not "how do I make explore green again".
## See environments/kind/README.md#maintenance.
name: Explore CI

on:
  pull_request:
    paths:
      - "kubernetes/**"
      - "charts/**"
      - "environments/**"
      - "scripts/explore-up.sh"
      - "scripts/explore-down.sh"
      # The smoke checks are part of what this job proves. A change that breaks
      # one of them would otherwise go untested.
      - "scripts/explore-login-check.sh"
      - "scripts/explore-backstage-login-check.sh"
      - ".github/workflows/explore-ci.yml"
  push:
    branches: [main]
    paths:
      - "kubernetes/**"
      - "charts/**"
      - "environments/**"
      - "scripts/explore-up.sh"
      - "scripts/explore-down.sh"
      # The smoke checks are part of what this job proves. A change that breaks
      # one of them would otherwise go untested.
      - "scripts/explore-login-check.sh"
      - "scripts/explore-backstage-login-check.sh"
      - ".github/workflows/explore-ci.yml"

# A second run of the same branch replaces the first: two kind clusters pulling
# the same images gains nothing and the job is the slowest one in the repo.
concurrency:
  group: explore-${{ github.ref }}
  cancel-in-progress: true

jobs:
  kind:
    name: kind (${{ matrix.mode }})
    # Skipped for pull requests from a fork, because the `external` half of the
    # matrix asks Argo CD to read a commit over HTTPS from this repository and a
    # fork's commit is not here. The job would stand a cluster up, wait the full
    # timeout for Applications that can never resolve, and fail for a reason
    # unrelated to the change. Forks run this on their own fork, where the
    # commit is where Argo CD looks.
    #
    # The `default` half would work from a fork — it never leaves the runner —
    # but a matrix cannot be half-skipped on this condition without splitting
    # the job in two, and one clear rule beats two jobs that drift apart.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      # Both paths, because they are not the same code and a bug in one is
      # invisible from the other.
      #
      # `default` is what a visitor runs: Argo CD reads the cluster's own Gitea,
      # seeded from the checkout. `external` is what this job used to run alone —
      # Argo CD reads this repository over HTTPS at a named commit.
      #
      # Only external was covered, so a change that moved Gitea's manifests out
      # of the Argo CD tree passed CI and then failed on the first `make try`:
      # the code that broke is never reached with --repo.
      fail-fast: false
      matrix:
        mode: [default, external]
    steps:
      - uses: actions/checkout@v4

      - name: Install kind
        uses: helm/kind-action@v1
        with:
          # The cluster is created by explore-up.sh from environments/kind/,
          # so the action is here only to put the binary on PATH.
          install_only: true

      # In `external` mode Argo CD pulls manifests over HTTPS from GitHub, so it
      # syncs the pushed commit rather than the checkout — `main` on a push, the
      # head commit on a pull request, otherwise a green run would be proving
      # main rather than the change under review. In `default` mode the question
      # does not arise: what runs is the checkout.
      #
      # Pull requests from forks are not covered: the head commit lives in the
      # fork and Argo CD would not find it on this repository.
      - name: Bring up the explore cluster
        env:
          # Fixed rather than generated, so the SSO check below can log in
          # without scraping the script's output. Nothing outside this runner
          # can reach the cluster, and it is destroyed at the end of the job.
          DEMO_PASSWORD: ci-demo-password
        run: |
          if [ "${{ matrix.mode }}" = external ]; then
            scripts/explore-up.sh \
              --rev "${{ github.event.pull_request.head.sha || github.sha }}" \
              --repo "${{ github.server_url }}/${{ github.repository }}"
          else
            # No arguments: the checkout is seeded into the cluster's git server
            # and Argo CD reads from there. Nothing has to be pushed, so this
            # also proves the path a visitor takes.
            scripts/explore-up.sh
          fi

      # explore-up.sh already asserts every Application is Synced/Healthy and
      # that the demo app answers 200 through the gateway. What is left is the
      # substitution layer, which nothing else would notice if it silently
      # stopped working.
      - name: Check the storage substitution
        run: |
          default_sc="$(kubectl get storageclass \
            -o jsonpath='{range .items[?(@.metadata.annotations.storageclass\.kubernetes\.io/is-default-class=="true")]}{.metadata.name}{"\n"}{end}')"
          if [ "$default_sc" != "longhorn" ]; then
            echo "expected 'longhorn' to be the only default StorageClass, got: ${default_sc:-none}" >&2
            kubectl get storageclass
            exit 1
          fi

      # The values file pins `cni.exclusive: false` so that istio-cni appends
      # itself to kindnet's config instead of taking the node over. Nothing else
      # would notice if that stopped working: the DaemonSet stays Healthy, and no
      # workload in this slice is injected, so the chain is only observable in
      # the node's own CNI config.
      - name: Check that istio-cni chained onto kindnet
        run: |
          conflist="$(docker exec kensan-lab-explore-control-plane \
            cat /etc/cni/net.d/10-kindnet.conflist)"
          types="$(echo "$conflist" | jq -r '[.plugins[].type] | join(" ")')"
          echo "CNI chain: ${types}"
          case " ${types} " in
            *" istio-cni "*) ;;
            *) echo "istio-cni is not in the CNI chain" >&2; exit 1 ;;
          esac
          if [ "$(echo "$conflist" | jq -r '.plugins[0].type')" = "istio-cni" ]; then
            echo "istio-cni took the chain over instead of appending to it" >&2
            exit 1
          fi

      - name: Check that Kyverno is actually evaluating policies
        run: |
          # Audit mode means violations never block a sync, so an engine that
          # quietly stopped reporting would look exactly like a clean cluster.
          # Requiring at least one PolicyReport distinguishes the two.
          kubectl get clusterpolicy
          reports="$(kubectl get policyreport -A --no-headers 2>/dev/null | wc -l)"
          echo "PolicyReports: ${reports}"
          [ "$reports" -gt 0 ]

      - name: Check that Prometheus is scraping and nothing is down
        run: |
          # A Prometheus that came up but scrapes nothing looks healthy to Argo
          # CD, and every dashboard would be empty for a reason no Application
          # status can show. Assert both halves: targets exist, and none of them
          # is down — a permanently-failing target is a substitution we got
          # wrong, not background noise.
          pod=prometheus-prometheus-kube-prometheus-prometheus-0
          kubectl -n monitoring wait --for=condition=Ready "pod/${pod}" --timeout=300s
          q() {
            kubectl -n monitoring exec "$pod" -c prometheus -- \
              wget -qO- "localhost:9090/api/v1/query?query=$1"
          }
          up="$(q 'count(up)' | jq -r '.data.result[0].value[1] // 0')"
          down="$(q 'count(up%20%3D%3D%200)' | jq -r '.data.result[0].value[1] // 0')"
          echo "scrape targets: ${up} up, ${down} down"
          [ "$up" -ge 5 ] || { echo "too few scrape targets" >&2; exit 1; }
          [ "$down" -eq 0 ] || {
            q 'up%20%3D%3D%200' | jq -r '.data.result[].metric.job' >&2
            echo "the jobs above have no target on kind — drop them in values/prometheus.yaml" >&2
            exit 1
          }

      - name: Check that the gateway serves a certificate it issued itself
        run: |
          # explore-up.sh already proved TLS answers 200. This proves the
          # certificate is the one cert-manager minted rather than Istio's
          # fallback, which would also serve traffic and hide the failure.
          kubectl -n istio-system get certificate explore-wildcard \
            -o jsonpath='{.status.conditions[?(@.type=="Ready")].status}' | grep -qx True
          issuer="$(echo | openssl s_client -connect 127.0.0.1:443 \
            -servername demo.127-0-0-1.sslip.io 2>/dev/null \
            | openssl x509 -noout -issuer)"
          echo "$issuer"
          echo "$issuer" | grep -q "kensan-lab explore"

      - name: Check that single sign-on actually completes
        run: |
          # explore-up.sh already proved an unauthenticated request is redirected
          # to Keycloak. That is only half the claim: a gate nobody can get
          # through would pass that check too. This walks the whole flow —
          # password grant against the realm, then the token through the gate —
          # so a broken client secret, a wrong issuer or a missing group mapper
          # fails here rather than in somebody's browser.
          realm=https://auth.127-0-0-1.sslip.io/realms/kensan
          secret="$(kubectl -n auth-system get secret oauth2-proxy-secret \
            -o go-template='{{index .data "client-secret" | base64decode}}')"
          token="$(curl -sk --resolve auth.127-0-0-1.sslip.io:443:127.0.0.1 \
            -d grant_type=password -d client_id=oauth2-proxy \
            -d "client_secret=${secret}" \
            -d username=demo -d password=ci-demo-password \
            "${realm}/protocol/openid-connect/token" | jq -r '.access_token // empty')"
          [ -n "$token" ] || { echo "the realm refused to issue a token" >&2; exit 1; }

          # The groups claim is what Grafana maps to a role. Absent, every user
          # silently lands as a Viewer and nobody notices until they cannot edit.
          #
          # Decoded in Python because a JWT payload is base64url *without*
          # padding, and `base64 -d` rejects that rather than assuming it.
          claims="$(echo "$token" | cut -d. -f2 | python3 -c '
          import base64, sys
          p = sys.stdin.read().strip()
          sys.stdout.write(base64.urlsafe_b64decode(p + "=" * (-len(p) % 4)).decode())')"
          echo "$claims" | jq -e '.groups | index("platform-admin")' >/dev/null \
            || { echo "the token carries no platform-admin group: $claims" >&2; exit 1; }

          # Not a Bearer token through the gate. oauth2-proxy is deliberately
          # not given the Authorization header any more, so that an
          # application's own token survives it — which means a Bearer token no
          # longer opens the gate, and a test using one would prove nothing a
          # person can do. These walk the flows a browser walks.
          code="$(scripts/explore-login-check.sh \
            demo.127-0-0-1.sslip.io demo ci-demo-password 2>&1 || true)"
          echo "demo (gateway ext_authz): ${code}"
          [ "$code" = "200" ] || { echo "signing in to the demo app failed" >&2; exit 1; }

          result="$(scripts/explore-backstage-login-check.sh \
            backstage.127-0-0-1.sslip.io demo ci-demo-password 2>&1 || true)"
          echo "backstage (native OIDC): ${result}"
          case "$result" in
            200*) ;;
            *) echo "signing in to Backstage failed" >&2; exit 1 ;;
          esac

      - name: Collect diagnostics
        if: failure()
        run: |
          kubectl get applications -n argocd -o wide || true
          kubectl get pods -A -o wide || true
          kubectl get events -A --sort-by=.lastTimestamp | tail -50 || true
          kubectl -n istio-system get gateway,httproute,svc || true
          for app in $(kubectl -n argocd get applications -o name 2>/dev/null); do
            echo "----- $app"
            kubectl -n argocd get "$app" -o jsonpath='{.status.conditions}{"\n"}' || true
          done

      - name: Tear down
        if: always()
        run: scripts/explore-down.sh
