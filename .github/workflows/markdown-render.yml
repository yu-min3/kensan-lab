name: Markdown renders on GitHub

# Every Markdown file outside docs/ is read on github.com, where MkDocs Material
# extensions are not errors — they are passed through as literal text. A page
# keeps building while displaying its own source, which is how docs/showcase.md
# shipped broken for 17 days (PR #468).
#
# This used to be a step in docs.yml, but that workflow only triggers on docs/
# and the transcluded READMEs, so a change to apps/**/*.md was never checked.
# The scopes are unrelated now that docs/ is site-only, so the check has its own
# trigger: any Markdown, anywhere.

on:
  pull_request:
    paths:
      - "**.md"
      - "scripts/check-github-render.py"
      - ".github/workflows/markdown-render.yml"
  push:
    branches:
      - main
    paths:
      - "**.md"
      - "scripts/check-github-render.py"
      - ".github/workflows/markdown-render.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-lint.txt

      - name: Install dependencies
        run: pip install -r requirements-lint.txt

      - name: Verify GitHub rendering
        run: python scripts/check-github-render.py
