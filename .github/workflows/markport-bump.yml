name: markport bump

## markport（app-kensan の workspace ビューア）の新しいリリースを週 1 回確かめ、
## 版と sha256 を書き換えた PR を出す。配備は PR の merge まで変わらない。
## sha256 はバイナリを実際に取得して計算し、上流の checksums と一致したときだけ使う
## （scripts/markport-bump.sh）。
##
## GITHUB_TOKEN で作った PR では他の workflow が起動しない。Manifest CI を回すには、
## PR を一度 close して reopen する。
on:
  schedule:
    - cron: "0 0 * * 1" # 月曜 09:00 JST
  workflow_dispatch:
    inputs:
      version:
        description: "上げる版（例 v0.29.1）。空なら最新リリース"
        required: false

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: markport-bump
  cancel-in-progress: false

jobs:
  bump:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Rewrite version and sha256
        id: bump
        env:
          VERSION: ${{ inputs.version }}
        run: |
          version=$(scripts/markport-bump.sh ${VERSION:+"$VERSION"})
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Skip if a PR for this version exists
        id: existing
        if: steps.bump.outputs.version != ''
        env:
          BRANCH: bot/markport-${{ steps.bump.outputs.version }}
        run: |
          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null; then
            echo "branch $BRANCH already exists" >&2
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: azure/setup-helm@v4
        if: steps.bump.outputs.version != '' && steps.existing.outputs.skip != 'true'

      - name: Render the release
        if: steps.bump.outputs.version != '' && steps.existing.outputs.skip != 'true'
        run: helm template app-markport charts/app-base -f kubernetes/apps/app-kensan/values-markport.yaml > /dev/null

      - name: Open PR
        if: steps.bump.outputs.version != '' && steps.existing.outputs.skip != 'true'
        env:
          VERSION: ${{ steps.bump.outputs.version }}
          BRANCH: bot/markport-${{ steps.bump.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$BRANCH"
          git commit -am "deploy(kensan): markport を ${VERSION} に上げる"
          git push origin "$BRANCH"
          gh pr create --base main --head "$BRANCH" \
            --title "deploy(kensan): markport を ${VERSION} に上げる" \
            --body "$(cat <<EOF
          markport の新しいリリース ${VERSION} が出たので、app-kensan の markport を上げる。

          - 変更: \`kubernetes/apps/app-kensan/values-markport.yaml\` の版と linux amd64 / arm64 の sha256
          - sha256: バイナリを取得して計算し、上流の \`checksums_${VERSION}.txt\` と一致を確認済み
          - 変更点: https://github.com/yomon8/markport/releases/tag/${VERSION}

          この PR は GITHUB_TOKEN で作ったので Manifest CI が起動していない。close して reopen すると回る。
          EOF
          )"
