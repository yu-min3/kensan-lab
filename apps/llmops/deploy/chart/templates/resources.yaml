{{- $name := printf "%s-api" .Release.Name -}}
{{- $image := printf "%s:%s" (required "image.repository required" .Values.image.repository) (required "image.tag required" .Values.image.tag) -}}
{{- $initImage := printf "%s:%s" (required "initImage.repository required" .Values.initImage.repository) (required "initImage.tag required" .Values.initImage.tag) -}}
{{- $secret := required "existingSecret required" .Values.existingSecret -}}
{{- if or (ne .Values.apiConfig.listen "0.0.0.0:8443") (ne .Values.apiConfig.state_directory "/data/jobs") (ne .Values.apiConfig.tls_key_file "/run/private/tls.key") (ne .Values.apiConfig.tls_cert_file "/run/private/tls.crt") -}}
{{- fail "listen/state/TLS mount paths must match the deployment contract" -}}
{{- end -}}
{{- if or (not (hasPrefix "https://" .Values.apiConfig.issuer)) (not (hasPrefix "https://" .Values.apiConfig.jwks_url)) (empty .Values.apiConfig.stores) (empty .Values.apiConfig.runtimes) (empty .Values.clientMapping.clients) -}}
{{- fail "HTTPS identity endpoints, stores, runtimes and client mapping required" -}}
{{- end -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $name }}
data:
  config.json: |
    {{- toPrettyJson .Values.apiConfig | nindent 4 }}
  client-mapping.json: |
    {{- toPrettyJson .Values.clientMapping | nindent 4 }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ $name }}-state
  annotations:
    argocd.argoproj.io/sync-options: Prune=false
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: longhorn
  resources:
    requests:
      storage: {{ .Values.persistence.size | quote }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: api}
  template:
    metadata:
      annotations:
        checksum/config: {{ dict "api" .Values.apiConfig "mapping" .Values.clientMapping | toJson | sha256sum | quote }}
        secret-revision: {{ .Values.secretRevision | quote }}
      labels: {app.kubernetes.io/name: llmops, app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: api}
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext: {runAsNonRoot: true, runAsUser: 65532, runAsGroup: 65532, fsGroup: 65532, seccompProfile: {type: RuntimeDefault}}
      initContainers:
        - name: private-credentials
          image: {{ $initImage | quote }}
          command: [/bin/sh, -ec]
          args:
            - 'umask 077; for file in /projected/*; do if [ -f "$file" ]; then cp "$file" "/private/$(basename "$file")"; fi; done; chmod 600 /private/*'
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          resources: {requests: {cpu: 10m, memory: 16Mi}, limits: {cpu: 100m, memory: 32Mi}}
          volumeMounts:
            - {name: projected, mountPath: /projected, readOnly: true}
            - {name: private, mountPath: /private}
      containers:
        - name: api
          image: {{ $image | quote }}
          args: [-config, /etc/llmops/config.json]
          ports: [{name: https, containerPort: 8443}]
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          resources: {{ toJson .Values.resources }}
          env: [{name: TMPDIR, value: /tmp}]
          volumeMounts:
            - {name: config, mountPath: /etc/llmops, readOnly: true}
            - {name: private, mountPath: /run/private, readOnly: true}
            - {name: state, mountPath: /data}
            - {name: tmp, mountPath: /tmp}
          startupProbe: {httpGet: {path: /healthz, port: https, scheme: HTTPS}, periodSeconds: 2, failureThreshold: 30}
          readinessProbe: {httpGet: {path: /healthz, port: https, scheme: HTTPS}, periodSeconds: 5}
          livenessProbe: {httpGet: {path: /healthz, port: https, scheme: HTTPS}, periodSeconds: 15}
      volumes:
        - name: config
          configMap: {name: {{ $name }}}
        - name: projected
          secret: {secretName: {{ $secret }}, defaultMode: 0440}
        - name: private
          emptyDir: {medium: Memory, sizeLimit: 16Mi}
        - name: state
          persistentVolumeClaim: {claimName: {{ $name }}-state}
        - name: tmp
          emptyDir: {sizeLimit: 64Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
spec:
  selector: {app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: api}
  ports: [{name: https, port: 443, targetPort: https, appProtocol: https}]
{{- if .Values.networkPolicy.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-isolation
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: llmops, app.kubernetes.io/instance: {{ .Release.Name }}}
  policyTypes: [Ingress, Egress]
  ingress: {{ toJson .Values.networkPolicy.ingress }}
  egress:
    - to:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: kube-system}}
          podSelector: {matchLabels: {k8s-app: kube-dns}}
      ports: [{protocol: UDP, port: 53}, {protocol: TCP, port: 53}]
    {{- with .Values.networkPolicy.egress }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
{{- end }}
{{- if .Values.route.enabled }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ $name }}
spec:
  parentRefs:
    - name: {{ required "route.gatewayName required" .Values.route.gatewayName }}
      namespace: {{ required "route.gatewayNamespace required" .Values.route.gatewayNamespace }}
  hostnames: [{{ required "route.hostname required" .Values.route.hostname | quote }}]
  rules:
    - backendRefs: [{name: {{ $name }}, port: 443}]
---
apiVersion: {{ required "installed BackendTLSPolicy API version required" .Values.route.backendTLSPolicyAPIVersion }}
kind: BackendTLSPolicy
metadata:
  name: {{ $name }}
spec:
  targetRefs: [{group: "", kind: Service, name: {{ $name }}}]
  validation:
    caCertificateRefs: [{group: "", kind: ConfigMap, name: {{ required "route.backendCAConfigMap required" .Values.route.backendCAConfigMap }}}]
    hostname: {{ required "route.backendHostname required" .Values.route.backendHostname | quote }}
{{- end }}
