# Values for charts/app-base — the chart the platform provides so that an
# application does not hand-write a Deployment, a Service and an HTTPRoute.
# https://github.com/yu-min3/kensan-lab/tree/main/charts/app-base
#
# The Argo CD Application that consumes this file lives in the platform
# repository (added by the pull request this template opened). Everything the
# application itself owns is in this directory.

image:
  # Production points this at the service's GHCR package. Explore points every
  # generated service at the one image `make try` built from this skeleton and
  # loaded into kind. Runtime values below are what distinguish the services.
  repository: ${{ values.imageRepository }}
  tag: ${{ values.imageTag }}

ports:
  http: 8000

probes:
  # app/main.py serves /health; the chart defaults to /healthz.
  path: /health

# What the page looks like, and what it says.
#
# These came from the scaffolder form and they live here rather than in the
# image on purpose: the frontend reads them at runtime through /api/config, so
# changing them is an edit to this file and a sync — no rebuild, no new tag.
# That round trip (edit -> pull request -> Argo CD -> the page) is the shortest
# demonstration of what the platform is for.
env:
  - name: APP_NAME
    value: "${{ values.name }}"
  - name: APP_THEME
    value: "${{ values.theme }}"
  - name: APP_MESSAGE
    value: "${{ values.message }}"

# The image declares `USER appuser`, a name rather than a number. The chart
# asks for runAsNonRoot, and the kubelet cannot resolve a name to a UID without
# the image's /etc/passwd — it refuses to start the container with
# "image has non-numeric user". Stating the UID the Dockerfile creates is what
# makes the two agree.
securityContext:
  runAsUser: 1000
  runAsGroup: 1000

# Production images are private and use a pull secret from Vault. Explore's
# image is already in the kind node and needs no registry or credential.
ghcrPullSecret:
  enabled: ${{ values.ghcrPullSecretEnabled }}

otel:
  enabled: ${{ values.otelEnabled }}
  serviceName: ${{ values.name }}

httproute:
  enabled: true
  hostnames:
    # Derived by the template from where the repository went: the real domain
    # on bare metal, the wildcard the explore certificate covers otherwise.
    - ${{ values.hostname }}
  gateway:
    name: ${{ values.gatewayName }}
    namespace: ${{ values.gatewayNamespace }}

# gateway-prod protects every hostname it serves (ADR-021 inverted this from
# opt-in to default), so the service is behind Keycloak whether or not this is
# set. What it adds is the route that carries /oauth2/* to oauth2-proxy — and
# without that the login redirect comes back to a 404 and nobody can get in.
#
# Two things still have to happen on the platform side before the flow closes;
# neither can be done from this repository:
#   1. this namespace listed in the ReferenceGrant `allow-app-oauth2-routes`
#      (kubernetes/auth/oauth2-proxy/resources/referencegrant-apps.yaml)
#   2. the hostname added to GATEWAY_PROTECTED_HOSTS in
#      bootstrap/keycloak/setup.sh, and the script re-run, so that Keycloak
#      accepts the redirect URI
#
# The pull request this template opened against the platform repository is
# where both belong.
auth:
  gatewayOAuth2:
    enabled: true

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    memory: 512Mi
