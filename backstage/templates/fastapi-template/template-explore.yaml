apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: fastapi-app-template
  title: FastAPI Application
  description: Create a FastAPI service entirely inside the explore cluster
  tags: [python, fastapi, gitops]
spec:
  owner: platform-team
  type: service

  parameters:
    - title: Application Information
      required: [name, description, owner, repoUrl]
      properties:
        name:
          title: Application Name
          type: string
          description: |
            アプリケーション名（小文字、英数字、ハイフンのみ）

            この名前から namespace `app-{name}` と公開ホスト
            `{name}.127-0-0-1.sslip.io` を作ります。
          pattern: '^[a-z0-9-]+$'
          ui:autofocus: true
        description:
          title: Description
          type: string
          description: Brief description of your application
        owner:
          title: Owner
          type: string
          description: Team or user that owns this application
          ui:field: OwnerPicker
          ui:options:
            catalogFilter:
              kind: [Group, User]
        repoUrl:
          title: Repository Location
          type: string
          description: |
            Explore クラスタ内の Gitea に作るリポジトリを指定します。
            クラスタ外へリポジトリや資格情報は送りません。
          ui:field: RepoUrlPicker
          ui:options:
            allowedHosts: [gitea.127-0-0-1.sslip.io]
            allowedOwners: [gitea-admin]

    - title: How it looks
      required: [theme, message]
      properties:
        theme:
          title: Theme
          type: string
          description: deploy/values.yaml に保存する画面テーマ
          default: day
          enum: [day, night]
          enumNames:
            - '昼 — 明るい空'
            - '夜 — 星空'
        message:
          title: Greeting
          type: string
          description: トップに表示する一行。デプロイ後も values.yaml で変更できます
          default: Hello from the platform
          maxLength: 60

    - title: Domain & System
      required: [domain, system]
      properties:
        domain:
          title: Domain
          type: string
          description: Select the domain this application belongs to
          default: platform
          enum: [platform, to-be-assigned]
          enumNames:
            - 'Platform (infrastructure and internal tools)'
            - '📋 To be Assigned (contact Platform Engineering)'
        system:
          title: System
          type: string
          description: Select the system this application belongs to
          default: developer-portal
          enum: [developer-portal, to-be-assigned]
          enumNames:
            - 'Developer Portal (Backstage self-service platform)'
            - '📋 To be Assigned (contact Platform Engineering)'

  steps:
    - id: fetch-base
      name: Fetch Base Template
      action: fetch:template
      input:
        url: ./skeleton
        values:
          name: ${{ parameters.name }}
          description: ${{ parameters.description }}
          owner: ${{ parameters.owner }}
          ownerSlug: ${{ parameters.owner | replace("group:default/", "") | replace("user:default/", "") | replace("group:", "") | replace("user:", "") }}
          repoName: ${{ (parameters.repoUrl | parseRepoUrl).repo }}
          repoOwner: ${{ (parameters.repoUrl | parseRepoUrl).owner }}
          domain: ${{ parameters.domain }}
          system: ${{ parameters.system }}
          theme: ${{ parameters.theme }}
          message: ${{ parameters.message }}
          hostname: ${{ parameters.name + ".127-0-0-1.sslip.io" }}

    - id: publish
      name: Publish to the cluster's Gitea
      action: publish:gitea
      input:
        description: ${{ parameters.description }}
        repoUrl: ${{ parameters.repoUrl }}
        defaultBranch: main
        repoVisibility: public

    # fetch:template substitutes file contents but not placeholder directory
    # names. Rename the two platform files before opening the pull request.
    - id: rename-platform-paths
      name: Name the platform files after the service
      action: fs:rename
      input:
        files:
          - from: .backstage/kubernetes/argocd/applications/apps/APPDIR
            to: .backstage/kubernetes/argocd/applications/apps/app-${{ parameters.name }}
          - from: .backstage/kubernetes/auth/oauth2-proxy/resources/REFGRANT.yaml
            to: .backstage/kubernetes/auth/oauth2-proxy/resources/referencegrant-app-${{ parameters.name }}.yaml

    - id: create-platform-pr
      name: Open the platform pull request
      action: gitea:pull-request
      input:
        repoUrl: gitea.127-0-0-1.sslip.io?repo=kensan-lab&owner=gitea-admin
        branchName: add-app-${{ parameters.name }}
        title: 'Add Application: ${{ parameters.name }}'
        description: |
          Explore クラスタ内の Backstage が作成しました。

          | File | Why |
          |---|---|
          | `kubernetes/argocd/applications/apps/app-${{ parameters.name }}/app.yaml` | `charts/app-base` でアプリをデプロイする Argo CD Application |
          | `kubernetes/auth/oauth2-proxy/resources/referencegrant-app-${{ parameters.name }}.yaml` | `/oauth2` route から oauth2-proxy への参照を許可する ReferenceGrant |

          マージ後、Argo CD が変更を検出して
          `${{ parameters.name }}.127-0-0-1.sslip.io` にデプロイします。
        sourcePath: .backstage

    # Keycloak accepts redirect URIs literally, so register the hostname that
    # was just created instead of relying on a wildcard.
    - id: register-redirect-uri
      name: Let Keycloak accept the new hostname
      action: keycloak:redirect-uri:add
      input:
        hostname: ${{ parameters.name }}.127-0-0-1.sslip.io

    # publish:gitea returns repoContentsUrl without a trailing slash. Passing
    # the complete URL also avoids losing the branch while resolving Gitea's
    # URL shape through catalogInfoPath.
    - id: register
      name: Register Component
      action: catalog:register
      input:
        catalogInfoUrl: ${{ steps.publish.output.repoContentsUrl + '/catalog-info.yaml' }}

  output:
    text:
      - title: 🎉 Explore 内での作成が完了しました
        content: |
          アプリケーションリポジトリ、Platform Config PR、カタログ登録を
          すべて Explore クラスタ内で作成しました。

          Platform Config PR をマージすると Argo CD が Application を作成します。
          Explore は生成したアプリのコンテナイメージを自動では build しないため、
          実際の Deployment には別途イメージが必要です。
    links:
      - title: 📦 アプリケーションリポジトリ
        url: ${{ steps.publish.output.remoteUrl }}
      - title: 📋 Backstageカタログで開く
        icon: catalog
        entityRef: ${{ steps.register.output.entityRef }}
      - title: 🔀 Platform Config PR
        url: ${{ steps['create-platform-pr'].output.remoteUrl }}
      - title: 🚀 Argo CD
        url: https://argocd.127-0-0-1.sslip.io/applications/app-${{ parameters.name }}
