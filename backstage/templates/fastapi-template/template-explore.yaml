apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: fastapi-app-template
  title: FastAPI Application
  description: Create a FastAPI service entirely inside the explore cluster
  tags: [python, fastapi, gitops]
spec:
  owner: demo-team
  type: service

  parameters:
    - title: Application Information
      required: [name, description, repoUrl]
      properties:
        name:
          title: Application Name
          type: string
          description: |
            アプリケーション名（小文字、英数字、ハイフンのみ）

            この名前から namespace `app-{name}` と公開ホスト
            `{name}.127-0-0-1.sslip.io` を作ります。
          pattern: '^[a-z0-9-]+$'
          ui:autofocus: true
        description:
          title: Description
          type: string
          description: Brief description of your application
        repoUrl:
          title: Repository Location
          type: string
          description: |
            Explore クラスタ内の Gitea に作るリポジトリを指定します。
            クラスタ外へリポジトリや資格情報は送りません。
          ui:field: RepoUrlPicker
          ui:options:
            allowedHosts: [gitea.127-0-0-1.sslip.io]
            allowedOwners: [gitea-admin]

    - title: How it looks
      required: [theme, message]
      properties:
        theme:
          title: Theme
          type: string
          description: deploy/values.yaml に保存する画面テーマ
          default: day
          enum: [day, night]
          enumNames:
            - '昼 — 明るい空'
            - '夜 — 星空'
        message:
          title: Greeting
          type: string
          description: トップに表示する一行。デプロイ後も values.yaml で変更できます
          default: Hello from the platform
          maxLength: 60

  steps:
    - id: fetch-base
      name: Fetch Base Template
      action: fetch:template
      input:
        url: ./skeleton
        values:
          name: ${{ parameters.name }}
          description: ${{ parameters.description }}
          owner: group:default/demo-team
          ownerSlug: demo-team
          repoName: ${{ (parameters.repoUrl | parseRepoUrl).repo }}
          repoOwner: ${{ (parameters.repoUrl | parseRepoUrl).owner }}
          domain: explore
          system: golden-path-demo
          theme: ${{ parameters.theme }}
          message: ${{ parameters.message }}
          hostname: ${{ parameters.name + ".127-0-0-1.sslip.io" }}
          # `make try` builds this skeleton once and loads the image into the
          # single kind node. Every generated service uses that exact image;
          # name, theme and greeting arrive through deploy/values.yaml.
          imageRepository: kensan-lab/explore-template
          imageTag: local
          ghcrPullSecretEnabled: false
          otelEnabled: false
          gatewayName: gateway-explore
          gatewayNamespace: istio-system
          platformRepoUrl: http://gitea-http.gitea.svc.cluster.local:3000/gitea-admin/kensan-lab
          applicationRepoUrl: ${{ "http://gitea-http.gitea.svc.cluster.local:3000/gitea-admin/" + (parameters.repoUrl | parseRepoUrl).repo }}

    - id: publish
      name: Publish to the cluster's Gitea
      action: publish:gitea
      input:
        description: ${{ parameters.description }}
        repoUrl: ${{ parameters.repoUrl }}
        defaultBranch: main
        repoVisibility: public

    # fetch:template substitutes file contents but not placeholder directory
    # names. Rename the two platform files before opening the pull request.
    #
    # Both land in environments/kind/generated-applications/app-<name>/. The
    # skeleton names production's paths, and neither works here: Explore's root
    # never reads kubernetes/argocd/applications/apps, and Explore's
    # oauth2-proxy Application takes only namespace.yaml out of
    # kubernetes/auth/oauth2-proxy/resources, so a grant left there is silently
    # dropped and the app's /oauth2 route dead-ends on RefNotPermitted.
    - id: rename-platform-paths
      name: Name the platform files after the service
      action: fs:rename
      input:
        files:
          - from: .backstage/kubernetes/argocd/applications/apps/APPDIR
            to: .backstage/environments/kind/generated-applications/app-${{ parameters.name }}
          - from: .backstage/kubernetes/auth/oauth2-proxy/resources/REFGRANT.yaml
            to: .backstage/environments/kind/generated-applications/app-${{ parameters.name }}/referencegrant.yaml

    - id: create-platform-pr
      name: Open the platform pull request
      action: gitea:pull-request
      input:
        repoUrl: gitea.127-0-0-1.sslip.io?repo=kensan-lab&owner=gitea-admin
        branchName: add-app-${{ parameters.name }}
        title: 'Add Application: ${{ parameters.name }}'
        description: |
          Explore クラスタ内の Backstage が作成しました。

          | File | Why |
          |---|---|
          | `environments/kind/generated-applications/app-${{ parameters.name }}/app.yaml` | Explore root が読み、`charts/app-base` でアプリをデプロイする Argo CD Application |
          | `environments/kind/generated-applications/app-${{ parameters.name }}/referencegrant.yaml` | `/oauth2` route から oauth2-proxy への参照を許可する ReferenceGrant |

          マージ後、Argo CD が変更を検出して
          `${{ parameters.name }}.127-0-0-1.sslip.io` にデプロイします。
        sourcePath: .backstage

    # Keycloak accepts redirect URIs literally, so register the hostname that
    # was just created instead of relying on a wildcard.
    - id: register-redirect-uri
      name: Let Keycloak accept the new hostname
      action: keycloak:redirect-uri:add
      input:
        hostname: ${{ parameters.name }}.127-0-0-1.sslip.io

    # publish:gitea returns repoContentsUrl without a trailing slash. Passing
    # the complete URL also avoids losing the branch while resolving Gitea's
    # URL shape through catalogInfoPath.
    - id: register
      name: Register Component
      action: catalog:register
      input:
        catalogInfoUrl: ${{ steps.publish.output.repoContentsUrl + '/catalog-info.yaml' }}

  output:
    text:
      - title: 🎉 Explore 内での作成が完了しました
        content: |
          アプリケーションリポジトリ、Platform Config PR、カタログ登録を
          すべて Explore クラスタ内で作成しました。

          Platform Config PR をマージすると Argo CD が Application を作成します。
          コンテナは `make try` がこの Template から build 済みです。
          Application はその同じイメージへ、フォームで選んだ名前・テーマ・
          メッセージを環境変数として渡します。
    links:
      - title: 📦 アプリケーションリポジトリ
        url: ${{ steps.publish.output.remoteUrl }}
      - title: 📋 Backstageカタログで開く
        icon: catalog
        entityRef: ${{ steps.register.output.entityRef }}
      - title: 🔀 Platform Config PR
        url: ${{ steps['create-platform-pr'].output.remoteUrl }}
      - title: 🚀 Argo CD
        url: https://argocd.127-0-0-1.sslip.io/applications/app-${{ parameters.name }}
