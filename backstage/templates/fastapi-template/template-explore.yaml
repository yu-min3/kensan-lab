apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: fastapi-app-template
  title: Golden Path Application
  description: Create, build, and prepare an application for deployment inside the Explore cluster
  tags: [python, fastapi, gitops]
spec:
  owner: demo-team
  type: service

  parameters:
    - title: Application Information
      required: [name, description, repoUrl]
      properties:
        name:
          title: Application Name
          type: string
          description: |
            Application name using lowercase letters, numbers, and hyphens.

            This creates namespace `app-{name}` and public hostname
            `{name}.127-0-0-1.sslip.io`.
          pattern: '^[a-z0-9-]+$'
          ui:autofocus: true
        description:
          title: Description
          type: string
          description: Brief description of your application
        repoUrl:
          title: Repository Location
          type: string
          description: |
            Choose the repository to create in the Explore cluster's Gitea.
            No repository or credential leaves the cluster.
          ui:field: RepoUrlPicker
          ui:options:
            allowedHosts: [gitea.127-0-0-1.sslip.io]
            allowedOwners: [demo]

    - title: How it looks
      required: [theme, message]
      properties:
        theme:
          title: Theme
          type: string
          description: Visual theme stored in deploy/values.yaml
          default: day
          enum: [day, night]
          enumNames:
            - 'Day — bright sky'
            - 'Night — starry sky'
        message:
          title: Greeting
          type: string
          description: A headline shown by the app; it remains configurable through values.yaml
          default: Hello from the platform
          maxLength: 60

  steps:
    - id: fetch-base
      name: Fetch Base Template
      action: fetch:template
      input:
        url: ./skeleton
        values:
          name: ${{ parameters.name }}
          description: ${{ parameters.description }}
          owner: group:default/demo-team
          ownerSlug: demo-team
          repoName: ${{ (parameters.repoUrl | parseRepoUrl).repo }}
          repoOwner: ${{ (parameters.repoUrl | parseRepoUrl).owner }}
          domain: explore
          system: golden-path-demo
          theme: ${{ parameters.theme }}
          message: ${{ parameters.message }}
          hostname: ${{ parameters.name + ".127-0-0-1.sslip.io" }}
          # Each generated repository is built by the Explore Gitea runner.
          # The first successful run replaces `pending` with the source commit
          # SHA, which gives Argo CD an immutable image and a rollout signal.
          imageRepository: ${{ "10.96.0.50:5000/demo/" + (parameters.repoUrl | parseRepoUrl).repo }}
          imageTag: pending
          ghcrPullSecretEnabled: false
          otelEnabled: false
          gatewayName: gateway-explore
          gatewayNamespace: istio-system
          platformRepoUrl: http://gitea-http.gitea.svc.cluster.local:3000/demo/kensan-lab
          applicationRepoUrl: ${{ "http://gitea-http.gitea.svc.cluster.local:3000/demo/" + (parameters.repoUrl | parseRepoUrl).repo }}

    - id: publish
      name: Publish to the cluster's Gitea
      action: publish:gitea
      input:
        description: ${{ parameters.description }}
        repoUrl: ${{ parameters.repoUrl }}
        defaultBranch: main
        repoVisibility: public

    - id: wait-for-build
      name: Test and build the generated application
      action: gitea:actions:wait
      input:
        repoUrl: ${{ parameters.repoUrl }}
        timeoutSeconds: 900

    # fetch:template substitutes file contents but not placeholder directory
    # names. Rename the two platform files before opening the pull request.
    #
    # Both land in environments/kind/generated-applications/app-<name>/. The
    # skeleton names production's paths, and neither works here: Explore's root
    # never reads kubernetes/argocd/applications/apps, and Explore's
    # oauth2-proxy Application takes only namespace.yaml out of
    # kubernetes/auth/oauth2-proxy/resources, so a grant left there is silently
    # dropped and the app's /oauth2 route dead-ends on RefNotPermitted.
    - id: rename-platform-paths
      name: Name the platform files after the service
      action: fs:rename
      input:
        files:
          - from: .backstage/kubernetes/argocd/applications/apps/APPDIR
            to: .backstage/environments/kind/generated-applications/app-${{ parameters.name }}
          - from: .backstage/kubernetes/auth/oauth2-proxy/resources/REFGRANT.yaml
            to: .backstage/environments/kind/generated-applications/app-${{ parameters.name }}/referencegrant.yaml

    - id: create-platform-pr
      name: Open the platform pull request
      action: gitea:pull-request
      input:
        repoUrl: gitea.127-0-0-1.sslip.io?repo=kensan-lab&owner=demo
        branchName: add-app-${{ parameters.name }}
        title: 'Add Application: ${{ parameters.name }}'
        description: |
          Backstage created this pull request inside the Explore cluster after
          the generated application's tests and image build succeeded.

          | File | Why |
          |---|---|
          | `environments/kind/generated-applications/app-${{ parameters.name }}/app.yaml` | Argo CD Application read by the Explore root and rendered through `charts/app-base` |
          | `environments/kind/generated-applications/app-${{ parameters.name }}/referencegrant.yaml` | ReferenceGrant that allows the `/oauth2` route to reach oauth2-proxy |

          After merge, Argo CD detects the change and deploys the application at
          `https://${{ parameters.name }}.127-0-0-1.sslip.io`.
        sourcePath: .backstage

    # Keycloak accepts redirect URIs literally, so register the hostname that
    # was just created instead of relying on a wildcard.
    - id: register-redirect-uri
      name: Let Keycloak accept the new hostname
      action: keycloak:redirect-uri:add
      input:
        hostname: ${{ parameters.name }}.127-0-0-1.sslip.io

    # publish:gitea returns repoContentsUrl without a trailing slash. Passing
    # the complete URL also avoids losing the branch while resolving Gitea's
    # URL shape through catalogInfoPath.
    - id: register
      name: Register Component
      action: catalog:register
      input:
        catalogInfoUrl: ${{ steps.publish.output.repoContentsUrl + '/catalog-info.yaml' }}

  output:
    text:
      - title: 🎉 The application is ready for platform review
        content: |
          The generated source has passed its tests, and Gitea Actions has built
          and pushed an immutable application image.

          You are the platform administrator for this walkthrough. Open the
          `kensan-lab` repository in Gitea: a pull request is waiting for your
          review. Merge it to let Argo CD deploy the application.
    links:
      - title: 📦 Application repository
        url: ${{ steps.publish.output.remoteUrl }}
      - title: 📋 Open in the Backstage catalog
        icon: catalog
        entityRef: ${{ steps.register.output.entityRef }}
      - title: 🔀 Review the kensan-lab pull request
        url: ${{ steps['create-platform-pr'].output.remoteUrl }}
      - title: 🏗️ Successful build
        url: ${{ steps['wait-for-build'].output.buildUrl }}
      - title: 🚀 Argo CD
        url: https://argocd.127-0-0-1.sslip.io/applications/app-${{ parameters.name }}
