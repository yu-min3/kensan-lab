apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: fastapi-app-template
  title: FastAPI Application
  description: Create a FastAPI service that arrives on the platform already wired up — chart, namespace, routing and CI
  tags:
    - python
    - fastapi
    - gitops
spec:
  owner: platform-team
  type: service

  parameters:
    - title: Application Information
      required:
        - name
        - description
        - owner
        - repoUrl
      properties:
        name:
          title: Application Name
          type: string
          description: |
            アプリケーション名（小文字、英数字、ハイフンのみ）

            📌 **この名前が影響するもの:**
            - Argo CD Application 名: `app-{name}`
            - デプロイ先 namespace: `app-{name}`（ADR-006: 1 アプリ 1 namespace）
            - 公開ホスト名: `{name}.app.yu-min3.com`
            - Backstage カタログのコンポーネント名

            💡 リポジトリ名とは独立して設定可能です
          pattern: '^[a-z0-9-]+$'
          ui:autofocus: true
        description:
          title: Description
          type: string
          description: Brief description of your application
        owner:
          title: Owner
          type: string
          description: Team or user that owns this application
          ui:field: OwnerPicker
          ui:options:
            catalogFilter:
              kind: [Group, User]
        repoUrl:
          title: Repository Location
          type: string
          description: |
            GitHubリポジトリの場所

            📌 **この設定が影響するもの:**
            - GitHubリポジトリURL: `https://github.com/{owner}/{repo}`
            - Argo CDのgit sync元
            - GitHub Actionsビルドパイプライン
            - コンテナイメージ名: `ghcr.io/{owner}/{repo}:{tag}`

            💡 推奨命名: `kensan-lab-apps-{アプリ名}` (追跡しやすいため)
          ui:field: RepoUrlPicker
          ui:options:
            allowedHosts:
              - github.com
            allowedOwners:
              - yu-min3

    - title: Domain & System
      required:
        - domain
        - system
      properties:
        domain:
          title: Domain
          type: string
          description: |
            Select the domain this application belongs to.

            📌 **What is a Domain?**
            A domain represents a bounded business context or area of the platform.

            💡 If your domain is not listed, select "To be Assigned" and contact Platform Engineering team.
          default: platform
          enum:
            - platform
            - to-be-assigned
          enumNames:
            - 'Platform (infrastructure and internal tools)'
            - '📋 To be Assigned (contact Platform Engineering)'
        system:
          title: System
          type: string
          description: |
            Select the system this application belongs to.

            📌 **What is a System?**
            A system is a collection of related components that work together.

            💡 If your system is not listed, select "To be Assigned" and contact Platform Engineering team.
          default: developer-portal
          enum:
            - developer-portal
            - to-be-assigned
          enumNames:
            - 'Developer Portal (Backstage self-service platform)'
            - '📋 To be Assigned (contact Platform Engineering)'

  steps:
    # Step 1: Fetch template skeleton
    - id: fetch-base
      name: Fetch Base Template
      action: fetch:template
      input:
        url: ./skeleton
        values:
          name: ${{ parameters.name }}
          description: ${{ parameters.description }}
          owner: ${{ parameters.owner }}
          # OwnerPicker returns an entity reference such as
          # "group:default/platform-engineering". Kubernetes label values allow
          # neither ':' nor '/', so the bare name is derived here for use in the
          # namespace labels; `owner` keeps the full reference for the catalog.
          ownerSlug: ${{ parameters.owner | replace("group:default/", "") | replace("user:default/", "") | replace("group:", "") | replace("user:", "") }}
          repoName: ${{ (parameters.repoUrl | parseRepoUrl).repo }}
          repoOwner: ${{ (parameters.repoUrl | parseRepoUrl).owner }}
          # Domain & System values
          domain: ${{ parameters.domain }}
          system: ${{ parameters.system }}

    # Step 2: Create application repository
    - id: publish
      name: Publish to GitHub
      action: publish:github
      input:
        description: ${{ parameters.description }}
        repoUrl: ${{ parameters.repoUrl }}
        defaultBranch: main
        repoVisibility: public
        deleteBranchOnMerge: true
        gitCommitMessage: 'Initial commit from Backstage template'

    # Step 3a: Create Argo CD Application CRs
    # fetch:template substitutes file *contents* only — a directory named
    # app-${{ values.name }} arrives with the placeholder still in it. So the
    # per-app path comes from targetPath here, which the scaffolder does
    # evaluate, and each destination needs its own step.
    - id: create-argocd-app
      name: Open the platform pull request (Application)
      action: publish:github:pull-request
      input:
        repoUrl: github.com?repo=kensan-lab&owner=yu-min3
        branchName: add-app-${{ parameters.name }}
        title: 'Add Application: ${{ parameters.name }}'
        description: |
          Auto-generated by Backstage.

          Adds the Argo CD Application for **${{ parameters.name }}** — it points
          at `charts/app-base` with the values file the new repository owns, so
          the platform keeps the chart and the service keeps its configuration.

          - **Application / namespace**: `app-${{ parameters.name }}`
          - **Repository**: `${{ (parameters.repoUrl | parseRepoUrl).owner }}/${{ (parameters.repoUrl | parseRepoUrl).repo }}`
          - **Domain / System**: `${{ parameters.domain }}` / `${{ parameters.system }}`

          ## ⚠️ Two things this PR cannot do

          `gateway-prod` protects every hostname it serves, so the service is
          behind Keycloak from the moment it is routed. Two pieces of that live
          in files this template cannot append to:

          1. **ReferenceGrant** — a companion pull request adds
             `kubernetes/auth/oauth2-proxy/resources/referencegrant-app-${{ parameters.name }}.yaml`.
             Without it the `/oauth2` route reports `RefNotPermitted` and the
             login redirect dead-ends. Merge both together.
          2. **Keycloak redirect URI** — add
             `${{ parameters.name }}.app.yu-min3.com` to
             `GATEWAY_PROTECTED_HOSTS` in `bootstrap/keycloak/setup.sh` and
             re-run the script. It is a shell array, not a file a scaffolder can
             add to.

          Merging without either leaves the service reachable and impossible to
          log into.
        sourcePath: .backstage/argocd-app.yaml
        targetPath: kubernetes/argocd/applications/apps/app-${{ parameters.name }}/app.yaml

    - id: create-referencegrant
      name: Open the platform pull request (ReferenceGrant)
      action: publish:github:pull-request
      input:
        repoUrl: github.com?repo=kensan-lab&owner=yu-min3
        branchName: add-app-${{ parameters.name }}-oauth2
        title: 'Allow /oauth2 for ${{ parameters.name }}'
        description: |
          Auto-generated by Backstage, companion to the Application pull request
          for **${{ parameters.name }}**.

          `charts/app-base` puts the `/oauth2` route in the application's own
          namespace — gateway-prod only admits routes from namespaces labelled
          `environment: production`, and auth-system is not one. Gateway API
          then refuses the cross-namespace backend unless auth-system grants it,
          and the refusal is quiet: the route reports `RefNotPermitted` and the
          login redirect dead-ends.

          One grant per application rather than editing a shared list — grants
          in the same namespace are additive.

          **Merge together with the Application pull request.**
        sourcePath: .backstage/referencegrant.yaml
        targetPath: kubernetes/auth/oauth2-proxy/resources/referencegrant-app-${{ parameters.name }}.yaml

    # Step 4: Register component in Backstage catalog
    - id: register
      name: Register Component
      action: catalog:register
      input:
        repoContentsUrl: ${{ steps.publish.output.repoContentsUrl }}
        catalogInfoPath: '/catalog-info.yaml'

  output:
    text:
      - title: 🎉 アプリケーション作成完了！
        content: |
          ## 次のステップ

          ### 1. Platform Configへのプルリクエスト
          Platform Engineerが作成済みの以下のPRをレビュー・マージします：
          - **PR**: [Platform Config PR](${{ steps['create-argocd-apps'].output.remoteUrl }})
          - **内容**: Argo CD Application CRsの追加

          ### 2. 最初のイメージリリース
          PRがマージされたら、上記リンクのアプリケーションリポジトリで最初のバージョンをリリースしてください：
          ```bash
          cd ${{ (parameters.repoUrl | parseRepoUrl).repo }}
          git tag v0.1.0
          git push origin v0.1.0
          ```
          GitHub Actionsが自動的にイメージをビルドしてGHCRにプッシュします。

          ### 3. アプリケーションがデプロイされます
          Argo CD が `app-${{ parameters.name }}` namespace にデプロイします。
          Deployment / Service / HTTPRoute は `charts/app-base` が
          `deploy/values.yaml` から生成するので、手書きの manifest はありません。

          デプロイ状況は Argo CD UI で確認できます。

    links:
      - title: 📦 アプリケーションリポジトリ
        url: ${{ steps.publish.output.remoteUrl }}
      - title: 📋 Backstageカタログで開く
        icon: catalog
        entityRef: ${{ steps.register.output.entityRef }}
      - title: 🔀 Platform Config PR
        url: ${{ steps['create-argocd-app'].output.remoteUrl }}
      - title: 🚀 Argo CD
        url: https://argocd.platform.yu-min3.com/applications/app-${{ parameters.name }}
