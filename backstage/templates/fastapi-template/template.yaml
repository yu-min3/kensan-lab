apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: fastapi-app-template
  title: FastAPI Application
  description: Create a FastAPI service that arrives on the platform already wired up — chart, namespace, routing and CI
  tags:
    - python
    - fastapi
    - gitops
spec:
  owner: platform-team
  type: service

  parameters:
    - title: Application Information
      required:
        - name
        - description
        - owner
        - repoUrl
      properties:
        name:
          title: Application Name
          type: string
          description: |
            アプリケーション名（小文字、英数字、ハイフンのみ）

            📌 **この名前が影響するもの:**
            - Argo CD Application 名: `app-{name}`
            - デプロイ先 namespace: `app-{name}`（ADR-006: 1 アプリ 1 namespace）
            - 公開ホスト名: `{name}.app.yu-min3.com`
            - Backstage カタログのコンポーネント名

            💡 リポジトリ名とは独立して設定可能です
          pattern: '^[a-z0-9-]+$'
          ui:autofocus: true
        description:
          title: Description
          type: string
          description: Brief description of your application
        owner:
          title: Owner
          type: string
          description: Team or user that owns this application
          ui:field: OwnerPicker
          ui:options:
            catalogFilter:
              kind: [Group, User]
        repoUrl:
          title: Repository Location
          type: string
          description: |
            GitHubリポジトリの場所

            📌 **この設定が影響するもの:**
            - GitHubリポジトリURL: `https://github.com/{owner}/{repo}`
            - Argo CDのgit sync元
            - GitHub Actionsビルドパイプライン
            - コンテナイメージ名: `ghcr.io/{owner}/{repo}:{tag}`

            💡 推奨命名: `kensan-lab-apps-{アプリ名}` (追跡しやすいため)
          ui:field: RepoUrlPicker
          ui:options:
            allowedHosts:
              - github.com
              # The explore cluster's own git server. Listing it here is what
              # lets one template serve both: the publish steps below branch on
              # whichever host was chosen, so nothing needs a mode switch.
              # On bare metal this entry is inert — there is no such server, so
              # it never resolves and never appears as a usable option.
              - gitea.127-0-0-1.sslip.io
            allowedOwners:
              - yu-min3
              - gitea-admin

    - title: How it looks
      required:
        - theme
        - message
      properties:
        theme:
          title: Theme
          type: string
          description: |
            画面の見た目

            📌 **この値が通る経路:**
            `deploy/values.yaml` → プラットフォームへの PR → Argo CD →
            Deployment の環境変数 → `/api/config` → 画面

            💡 イメージには焼き込まれません。後から変えるときも
            values.yaml を編集して sync するだけで、再ビルドは不要です
          default: day
          enum:
            - day
            - night
          enumNames:
            - '昼 — 明るい空'
            - '夜 — 星空'
        message:
          title: Greeting
          type: string
          description: トップに大きく出る一行。デプロイ後も values.yaml で変えられます
          default: Hello from the platform
          maxLength: 60

    - title: Domain & System
      required:
        - domain
        - system
      properties:
        domain:
          title: Domain
          type: string
          description: |
            Select the domain this application belongs to.

            📌 **What is a Domain?**
            A domain represents a bounded business context or area of the platform.

            💡 If your domain is not listed, select "To be Assigned" and contact Platform Engineering team.
          default: platform
          enum:
            - platform
            - to-be-assigned
          enumNames:
            - 'Platform (infrastructure and internal tools)'
            - '📋 To be Assigned (contact Platform Engineering)'
        system:
          title: System
          type: string
          description: |
            Select the system this application belongs to.

            📌 **What is a System?**
            A system is a collection of related components that work together.

            💡 If your system is not listed, select "To be Assigned" and contact Platform Engineering team.
          default: developer-portal
          enum:
            - developer-portal
            - to-be-assigned
          enumNames:
            - 'Developer Portal (Backstage self-service platform)'
            - '📋 To be Assigned (contact Platform Engineering)'

  steps:
    # Step 1: Fetch template skeleton
    - id: fetch-base
      name: Fetch Base Template
      action: fetch:template
      input:
        url: ./skeleton
        values:
          name: ${{ parameters.name }}
          description: ${{ parameters.description }}
          owner: ${{ parameters.owner }}
          # OwnerPicker returns an entity reference such as
          # "group:default/platform-engineering". Kubernetes label values allow
          # neither ':' nor '/', so the bare name is derived here for use in the
          # namespace labels; `owner` keeps the full reference for the catalog.
          ownerSlug: ${{ parameters.owner | replace("group:default/", "") | replace("user:default/", "") | replace("group:", "") | replace("user:", "") }}
          repoName: ${{ (parameters.repoUrl | parseRepoUrl).repo }}
          repoOwner: ${{ (parameters.repoUrl | parseRepoUrl).owner }}
          # Domain & System values
          domain: ${{ parameters.domain }}
          system: ${{ parameters.system }}
          # Appearance. These are written into deploy/values.yaml rather than
          # into the source, so they reach the running pod as environment
          # variables and can be changed later without building anything.
          theme: ${{ parameters.theme }}
          message: ${{ parameters.message }}
          # The hostname follows from where the repository went. Bare metal
          # serves apps under the real domain; the explore cluster serves them
          # under the wildcard its certificate covers. Deriving it here keeps
          # deploy/values.yaml free of a mode switch.
          hostname: ${{ (parameters.repoUrl | parseRepoUrl).host == "github.com" and (parameters.name + ".app.yu-min3.com") or (parameters.name + ".127-0-0-1.sslip.io") }}

    # Step 2: Create the application repository.
    #
    # Two of these, and exactly one runs. The branch is taken from the host the
    # repository picker offered rather than from a mode flag, so there is one
    # template and no switch to set wrongly.
    - id: publish
      name: Publish to GitHub
      if: ${{ (parameters.repoUrl | parseRepoUrl).host == "github.com" }}
      action: publish:github
      input:
        description: ${{ parameters.description }}
        repoUrl: ${{ parameters.repoUrl }}
        defaultBranch: main
        repoVisibility: public
        deleteBranchOnMerge: true
        gitCommitMessage: 'Initial commit from Backstage template'

    - id: publish-gitea
      name: Publish to the cluster's git server
      if: ${{ (parameters.repoUrl | parseRepoUrl).host != "github.com" }}
      action: publish:gitea
      input:
        description: ${{ parameters.description }}
        repoUrl: ${{ parameters.repoUrl }}
        defaultBranch: main
        repoVisibility: public

    # Step 3a: Create Argo CD Application CRs
    # fetch:template substitutes file *contents* only — a directory named
    # after a placeholder arrives with the placeholder still in it. And
    # publish:github:pull-request cannot fix that up: its sourcePath is globbed
    # as a directory and its targetPath is joined as a prefix, so neither can
    # name a destination file. fs:rename runs its from/to through the
    # expression engine, which is what makes the per-app paths possible — and
    # lets the whole change stay in one pull request.
    - id: rename-platform-paths
      name: Name the platform files after the service
      action: fs:rename
      input:
        files:
          - from: .backstage/kubernetes/argocd/applications/apps/APPDIR
            to: .backstage/kubernetes/argocd/applications/apps/app-${{ parameters.name }}
          - from: .backstage/kubernetes/auth/oauth2-proxy/resources/REFGRANT.yaml
            to: .backstage/kubernetes/auth/oauth2-proxy/resources/referencegrant-app-${{ parameters.name }}.yaml

    - id: create-platform-pr
      name: Open the platform pull request
      if: ${{ (parameters.repoUrl | parseRepoUrl).host == "github.com" }}
      action: publish:github:pull-request
      input:
        repoUrl: github.com?repo=kensan-lab&owner=yu-min3
        branchName: add-app-${{ parameters.name }}
        title: 'Add Application: ${{ parameters.name }}'
        description: |
          Auto-generated by Backstage.

          - **Application / namespace**: `app-${{ parameters.name }}`
          - **Repository**: `${{ (parameters.repoUrl | parseRepoUrl).owner }}/${{ (parameters.repoUrl | parseRepoUrl).repo }}`
          - **Domain / System**: `${{ parameters.domain }}` / `${{ parameters.system }}`

          ## What this adds

          | File | Why |
          |---|---|
          | `kubernetes/argocd/applications/apps/app-${{ parameters.name }}/app.yaml` | The Application: `charts/app-base` driven by the values file the service repository owns |
          | `kubernetes/auth/oauth2-proxy/resources/referencegrant-app-${{ parameters.name }}.yaml` | Lets the service's `/oauth2` route reach oauth2-proxy across namespaces. Without it the route reports `RefNotPermitted` and the login redirect dead-ends |

          ## ⚠️ One thing this PR cannot do

          `gateway-prod` protects every hostname it serves, so **Keycloak has to
          accept the redirect URI before anyone can log in**:

          ```
          bootstrap/keycloak/setup.sh → GATEWAY_PROTECTED_HOSTS
            add: ${{ parameters.name }}.app.yu-min3.com
          then re-run the script
          ```

          It is a shell array, not a file a scaffolder can add to. Merging
          without it leaves the service reachable and impossible to log into.
        # A directory, because the action globs it. targetPath is left off: the
        # tree under .backstage already mirrors this repository's layout.
        sourcePath: .backstage

    - id: create-platform-pr-gitea
      name: Open the platform pull request
      if: ${{ (parameters.repoUrl | parseRepoUrl).host != "github.com" }}
      action: gitea:pull-request
      input:
        repoUrl: ${{ (parameters.repoUrl | parseRepoUrl).host }}?repo=kensan-lab&owner=gitea-admin
        branchName: add-app-${{ parameters.name }}
        title: 'Add Application: ${{ parameters.name }}'
        description: |
          Opened by the portal, against this cluster's own copy of the platform
          repository. Nothing left the machine.

          | File | Why |
          |---|---|
          | `kubernetes/argocd/applications/apps/app-${{ parameters.name }}/app.yaml` | The Application: `charts/app-base` driven by the values file the service repository owns |
          | `kubernetes/auth/oauth2-proxy/resources/referencegrant-app-${{ parameters.name }}.yaml` | Lets the service's `/oauth2` route reach oauth2-proxy across namespaces |

          Merging this is what deploys the service. Argo CD notices within three
          minutes and `${{ parameters.name }}.127-0-0-1.sslip.io` starts answering.
        sourcePath: .backstage

    # Keycloak matches redirect URIs literally — a wildcard in the host is
    # accepted at registration and refused at authorization. So the callback for
    # a hostname that did not exist a minute ago is registered as it is created.
    # Bare metal does the same by hand, by re-running the bootstrap script; the
    # GitHub branch keeps that behaviour and says so in its pull request body.
    - id: register-redirect-uri
      name: Let Keycloak accept the new hostname
      if: ${{ (parameters.repoUrl | parseRepoUrl).host != "github.com" }}
      action: keycloak:redirect-uri:add
      input:
        hostname: ${{ parameters.name }}.127-0-0-1.sslip.io

    # Step 4: Register component in Backstage catalog
    #
    # Two steps rather than one. The path form of this action resolves
    # catalogInfoPath against the publish step's repoContentsUrl, and that
    # resolution is wrong for Gitea: the branch disappears, leaving
    # .../src/branch/catalog-info.yaml, which the catalog refuses with
    #
    #   NotFoundError: Unable to read url, no matching files found
    #
    # measured on the explore cluster, with both a leading slash and without.
    # GitHub resolves correctly because git-url-parse understands its
    # .../blob/<branch>/ shape, so that branch is left alone.
    #
    # The Gitea branch skips resolution altogether and hands the action the
    # absolute URL, which it takes as given. The separator is written out
    # because this repository's own publish:gitea returns the directory URL
    # without a trailing slash (packages/backend/src/modules/giteaPublish.ts),
    # unlike the upstream action of the same name.
    - id: register
      name: Register Component
      if: ${{ (parameters.repoUrl | parseRepoUrl).host == "github.com" }}
      action: catalog:register
      input:
        repoContentsUrl: ${{ steps.publish.output.repoContentsUrl }}
        catalogInfoPath: '/catalog-info.yaml'

    - id: register-gitea
      name: Register Component
      if: ${{ (parameters.repoUrl | parseRepoUrl).host != "github.com" }}
      action: catalog:register
      input:
        catalogInfoUrl: ${{ steps['publish-gitea'].output.repoContentsUrl + '/catalog-info.yaml' }}

  output:
    text:
      - title: 🎉 アプリケーション作成完了！
        content: |
          ## 次のステップ

          ### 1. Platform Configへのプルリクエスト
          Platform Engineerが作成済みの以下のPRをレビュー・マージします：
          - **PR**: [Platform Config PR](${{ steps['create-platform-pr'].output.remoteUrl }})
          - **内容**: Argo CD Application CRsの追加

          ### 2. 最初のイメージリリース
          PRがマージされたら、上記リンクのアプリケーションリポジトリで最初のバージョンをリリースしてください：
          ```bash
          cd ${{ (parameters.repoUrl | parseRepoUrl).repo }}
          git tag v0.1.0
          git push origin v0.1.0
          ```
          GitHub Actionsが自動的にイメージをビルドしてGHCRにプッシュします。

          ### 3. アプリケーションがデプロイされます
          Argo CD が `app-${{ parameters.name }}` namespace にデプロイします。
          Deployment / Service / HTTPRoute は `charts/app-base` が
          `deploy/values.yaml` から生成するので、手書きの manifest はありません。

          デプロイ状況は Argo CD UI で確認できます。

    # Every link below has two possible sources, because every step that
    # produces one is branched on the host. A skipped step has no output, so
    # without the fallback the Gitea path finishes and hands back a page of
    # dead links.
    links:
      - title: 📦 アプリケーションリポジトリ
        url: ${{ steps.publish.output.remoteUrl or steps['publish-gitea'].output.remoteUrl }}
      - title: 📋 Backstageカタログで開く
        icon: catalog
        entityRef: ${{ steps.register.output.entityRef or steps['register-gitea'].output.entityRef }}
      - title: 🔀 Platform Config PR
        url: ${{ steps['create-platform-pr'].output.remoteUrl or steps['create-platform-pr-gitea'].output.remoteUrl }}
      - title: 🚀 Argo CD
        url: ${{ (parameters.repoUrl | parseRepoUrl).host == "github.com" and ("https://argocd.platform.yu-min3.com/applications/app-" + parameters.name) or ("https://argocd.127-0-0-1.sslip.io/applications/app-" + parameters.name) }}
