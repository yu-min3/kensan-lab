apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "app-base.name" . }}
  labels:
    {{- include "app-base.labels" . | nindent 4 }}
  {{- if .Values.reloader }}
  annotations:
    reloader.stakater.com/auto: "true"
  {{- end }}
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      {{- include "app-base.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "app-base.selectorLabels" . | nindent 8 }}
    spec:
      {{- if kindIs "bool" .Values.automountServiceAccountToken }}
      automountServiceAccountToken: {{ .Values.automountServiceAccountToken }}
      {{- end }}
      serviceAccountName: {{ include "app-base.name" . }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: app
          {{- $repository := required "image.repository is required" .Values.image.repository }}
          {{- if not (kindIs "string" .Values.image.digest) }}{{ fail "image.digest must be a string" }}{{ end }}
          {{- $digest := default "" .Values.image.digest }}
          {{- $tag := default "" .Values.image.tag }}
          {{- if $digest }}
          {{- if $tag }}{{ fail "image.tag must be empty when image.digest is set" }}{{ end }}
          {{- if not (regexMatch "^sha256:[0-9a-f]{64}$" $digest) }}{{ fail "image.digest must be a full lowercase sha256 digest" }}{{ end }}
          image: "{{ $repository }}@{{ $digest }}"
          {{- else }}
          image: "{{ $repository }}:{{ required "image.tag or image.digest is required" $tag }}"
          {{- end }}
          {{- with .Values.command }}
          command:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.args }}
          args:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.ports.http }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          env:
            {{- if .Values.otel.enabled }}
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: {{ .Values.otel.endpoint | quote }}
            - name: OTEL_SERVICE_NAME
              value: {{ .Values.otel.serviceName | default (include "app-base.name" .) | quote }}
            {{- end }}
            {{- with .Values.env }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          livenessProbe:
            httpGet:
              path: {{ .Values.probes.path }}
              port: http
            initialDelaySeconds: {{ .Values.probes.initialDelaySeconds }}
          readinessProbe:
            httpGet:
              path: {{ .Values.probes.path }}
              port: http
            initialDelaySeconds: {{ .Values.probes.initialDelaySeconds }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- if or .Values.pvc.enabled .Values.extraVolumeMounts }}
          volumeMounts:
            {{- if .Values.pvc.enabled }}
            - name: data
              mountPath: {{ .Values.pvc.mountPath }}
            {{- end }}
            {{- with .Values.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- end }}
      {{- if or .Values.pvc.enabled .Values.extraVolumes }}
      volumes:
        {{- if .Values.pvc.enabled }}
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "app-base.pvcName" . }}
        {{- end }}
        {{- with .Values.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- end }}
