{{- if .Values.httproute.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "app-base.name" . }}
  labels:
    k8s-gateway.dns/ignore: {{ not .Values.httproute.dns.enabled | quote }}
    {{- include "app-base.labels" . | nindent 4 }}
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: {{ .Values.httproute.gateway.name }}
      namespace: {{ .Values.httproute.gateway.namespace }}
      {{- with .Values.httproute.gateway.sectionName }}
      sectionName: {{ . | quote }}
      {{- end }}
  hostnames:
    {{- toYaml (required "httproute.hostnames is required when httproute.enabled" .Values.httproute.hostnames) | nindent 4 }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: {{ include "app-base.name" . }}
          port: {{ .Values.ports.http }}
{{- end }}
