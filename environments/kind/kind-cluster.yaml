## kind cluster for the explore layer (see environments/kind/README.md).
##
## Single node on purpose: explore demonstrates *how the platform is composed*,
## not how it behaves under failure. Replica rebuild, node drain and L2 lease
## expiry cannot happen here and are deliberately left to the bare-metal cluster
## (docs/getting-started/try-it-with-kind.md#what-kind-cannot-show).
apiVersion: kind.x-k8s.io/v1alpha4
kind: Cluster
name: kensan-lab-explore

nodes:
  - role: control-plane

    ## Pinned to the Kubernetes version the bare-metal cluster runs. Without it,
    ## kind picks the default for whichever kind release happens to be
    ## installed, and this layer stops testing what it claims to: the first two
    ## runs of it produced v1.35.0 in CI and v1.36.1 on a laptop, against a
    ## production cluster on v1.33.
    ##
    ## It also keeps `make try` from breaking on its own. A visitor six months
    ## from now installs a newer kind, gets a Kubernetes the pinned charts have
    ## never seen, and the quickstart fails through no change of ours.
    ##
    ## Bump this when the real cluster moves, and take the digest from the kind
    ## release notes rather than by tag — the tag is mutable.
    image: kindest/node:v1.33.12@sha256:3f5c8443c620245e4d355cfe09e96a91ead32ceaa569d3f1ca9edf0cb2fe2ff4

    ## The bare-metal cluster reaches the gateway through a Cilium L2 VIP
    ## (192.168.0.242). kind nodes live on a Docker bridge with no physical LAN
    ## to announce into, so the substitute is host:80 -> node:30080, served by
    ## the pinned NodePort Service in resources/gateway-explore.yaml.
    extraPortMappings:
      - containerPort: 30080
        hostPort: 80
        listenAddress: "127.0.0.1"
        protocol: TCP
      - containerPort: 30443
        hostPort: 443
        listenAddress: "127.0.0.1"
        protocol: TCP

    ## Several platform components carry a `hardware-class` node affinity
    ## (preferred, not required) that exists because the real cluster mixes
    ## Raspberry Pi 5 workers with an x86 mini PC. Labelling the single kind
    ## node satisfies those rules instead of patching them away per component.
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "hardware-class=high-performance"
