apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: demo
  namespace: app-demo
  labels:
    app.kubernetes.io/name: demo
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: demo
  endpoints:
    - port: http
      path: /metrics
      # The runtime dashboard rates this over a minute. At 30s that window
      # holds the two samples a rate needs and nothing to spare, so a single
      # missed scrape empties the panel.
      interval: 15s
      scrapeTimeout: 10s
