---
apiVersion: v1
kind: Namespace
metadata:
  name: explore-build
  labels:
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: privileged
    pod-security.kubernetes.io/warn: privileged
---
apiVersion: v1
kind: Service
metadata:
  name: registry
  namespace: explore-build
spec:
  # Stable because generated values files must name the registry before a
  # cluster exists. It is inside kind's default Service CIDR.
  clusterIP: 10.96.0.50
  selector:
    app.kubernetes.io/name: explore-registry
  ports:
    - name: registry
      port: 5000
      targetPort: 5000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: registry
  namespace: explore-build
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: explore-registry
  template:
    metadata:
      labels:
        app.kubernetes.io/name: explore-registry
    spec:
      containers:
        - name: registry
          image: docker.io/library/registry:2.8.3
          ports:
            - name: registry
              containerPort: 5000
          readinessProbe:
            httpGet:
              path: /v2/
              port: registry
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: act-runner
  namespace: explore-build
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: act-runner
  template:
    metadata:
      labels:
        app.kubernetes.io/name: act-runner
    spec:
      volumes:
        - name: docker-certs
          emptyDir: {}
        - name: runner-data
          emptyDir: {}
      containers:
        - name: runner
          image: docker.io/gitea/act_runner:0.2.13
          command:
            - sh
            - -c
            - >-
              while ! nc -z localhost 2376 </dev/null; do
                echo 'waiting for Docker daemon'; sleep 2;
              done;
              /sbin/tini -- /opt/act/run.sh
          env:
            - name: DOCKER_HOST
              value: tcp://localhost:2376
            - name: DOCKER_CERT_PATH
              value: /certs/client
            - name: DOCKER_TLS_VERIFY
              value: "1"
            - name: GITEA_INSTANCE_URL
              value: http://gitea-http.gitea.svc.cluster.local:3000
            - name: GITEA_RUNNER_REGISTRATION_TOKEN
              valueFrom:
                secretKeyRef:
                  name: act-runner-registration
                  key: token
            - name: GITEA_RUNNER_NAME
              value: explore-builder
            - name: GITEA_RUNNER_LABELS
              value: explore-builder:docker://docker.gitea.com/runner-images:ubuntu-latest
          volumeMounts:
            - name: docker-certs
              mountPath: /certs
            - name: runner-data
              mountPath: /data
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 512Mi
        - name: daemon
          image: docker.io/library/docker:27.5.1-dind
          args:
            - --insecure-registry=10.96.0.50:5000
          env:
            - name: DOCKER_TLS_CERTDIR
              value: /certs
          securityContext:
            privileged: true
          volumeMounts:
            - name: docker-certs
              mountPath: /certs
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
