# Gitea's route, applied after the Gateway API CRDs exist.
#
# Split from the namespace on purpose. The namespace has to be there before the
# chart installs, which is before Argo CD has synced anything — and at that
# point `kind: HTTPRoute` does not resolve yet, because the CRDs arrive with the
# gateway-api Application at wave -5. Applying both together failed with
# "no matches for kind HTTPRoute ... ensure CRDs are installed first".
# Argo CD does not use this route. It reads Gitea over the in-cluster Service,
# which keeps the self-signed CA out of repo-server's trust store. This
# hostname is for people: the repository the scaffolder created, and the pull
# request it opened, are read here.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: gitea
  namespace: gitea
  annotations:
    ## After the Gateway, which is wave 2. A route applied before its parent
    ## exists is never Accepted, and Argo CD waits for it to become healthy
    ## before moving on — so the certificates later in this Application never
    ## get applied, and every component that mounts the CA sits in
    ## FailedMount. The same wave the other routes use, for the same reason.
    argocd.argoproj.io/sync-wave: "4"
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      namespace: istio-system
      name: gateway-explore
  hostnames:
    - gitea.127-0-0-1.sslip.io
  rules:
    - backendRefs:
        - group: ""
          kind: Service
          name: gitea-http
          port: 3000
