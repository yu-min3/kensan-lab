## Backstage configuration for the explore cluster.
##
## Layered as a third `--config` on top of the two baked into the image, so the
## catalog locations, the entity rules and the oauth2Proxy auth provider all
## come from the shared config and only the things that cannot work here are
## replaced:
##
##   database      Production runs PostgreSQL with credentials from Vault. There
##                 is no Vault here and nothing to persist, so the throwaway
##                 cluster gets the in-memory SQLite the repository already uses
##                 for local development. Everything is lost on restart, which
##                 is the correct behaviour for a cluster that is itself thrown
##                 away.
##   URLs          The real host does not resolve here.
##   integrations  Gitea is added, because the cluster has a git server of its
##                 own and the golden path writes to it. GitHub is left as the
##                 shared config has it, but only so the key exists: the token
##                 scripts/explore-up.sh supplies is a placeholder GitHub would
##                 reject, and nothing on this path calls it. It cannot be an
##                 empty string — the backend type-checks the key at startup and
##                 an empty one stops the catalog, scaffolder and techdocs
##                 plugins from initialising, without stopping the process or
##                 failing the probe. See the comment on the Secret in
##                 explore-up.sh.
##   catalog       The organisation scanner is pushed a year into the future
##                 rather than removed — see below.
##
## Everything a visitor came to see — the golden path template, the catalog, the
## scaffolder — is unaffected: those are read from files inside the image.
##
##   auth          Only the discovery URL. Backstage signs people in against
##                 Keycloak itself, so the provider, the resolver and the
##                 session handling are all the bare-metal ones; what differs is
##                 which Keycloak. The sign-in resolver matches on email, which
##                 is why the demo account scripts/explore-up.sh creates carries
##                 the address of a User the catalog already ships.
##
## ── Why the scanner is neutered rather than deleted ──────────────────────────
##
## Backstage merges `--config` files key by key, and a later file cannot remove
## a key an earlier one set. Both of these were tried against a running cluster
## and neither worked:
##
##   catalog.providers: {}            the deep merge keeps `github` underneath
##   catalog.providers.github: null   likewise; the provider still registers
##
## Loading only this file, without the two baked-in ones, does remove it — and
## breaks the frontend, which validates the config against the schema compiled
## into the app bundle (`Invalid app bundle schema`).
##
## What does work is overriding the schedule, because those are leaf values.
## The provider registers and then never runs, which for a cluster measured in
## minutes is indistinguishable from absent — and it leaves the shared config as
## the single description of what the catalog contains.
apiVersion: v1
kind: ConfigMap
metadata:
  name: backstage-explore-config
  namespace: backstage
data:
  app-config.explore.yaml: |
    app:
      title: kensan-lab Platform Portal
      baseUrl: https://backstage.127-0-0-1.sslip.io

    backend:
      ## https, not http: the frontend is served over TLS, and a page loaded
      ## over https calling an http backend is blocked as mixed content — the
      ## portal would render and then fail every request it makes.
      baseUrl: https://backstage.127-0-0-1.sslip.io
      cors:
        origin: https://backstage.127-0-0-1.sslip.io
        methods: [GET, HEAD, PATCH, POST, PUT, DELETE]
        credentials: true
      database:
        client: better-sqlite3
        connection: ':memory:'


    auth:
      providers:
        oidc:
          production:
            metadataUrl: https://auth.127-0-0-1.sslip.io/realms/kensan/.well-known/openid-configuration

    # The cluster's own git server. Present only here: bare metal has no such
    # entry, which is what keeps the template's Gitea branch from resolving
    # there. Reached over the Service rather than the gateway, so Node does not
    # need to be told about the self-signed CA for this call.
    integrations:
      gitea:
        - host: gitea.127-0-0-1.sslip.io
          baseUrl: http://gitea-http.gitea.svc.cluster.local:3000
          username: ${GITEA_ADMIN_USERNAME}
          password: ${GITEA_ADMIN_PASSWORD}

    # Read by the keycloak:redirect-uri:add action. A new service's hostname has
    # to be accepted by Keycloak before anybody can sign in to it, and a
    # wildcard is refused at authorization — so it is registered as it is made.
    kensanLab:
      keycloakAdmin:
        baseUrl: http://keycloak.platform-auth-prod.svc.cluster.local:8080
        realm: kensan
        username: ${KEYCLOAK_ADMIN_USERNAME}
        password: ${KEYCLOAK_ADMIN_PASSWORD}

    catalog:
      providers:
        github:
          kensanLabApps:
            schedule:
              initialDelay: { days: 365 }
              frequency: { days: 365 }
              timeout: { minutes: 1 }
