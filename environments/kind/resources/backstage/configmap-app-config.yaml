## Backstage configuration for the explore cluster.
##
## Layered as a third `--config` on top of the two baked into the image, so the
## the entity rules and the oauth2Proxy auth provider come from the shared
## config and only the things that cannot work here are
## replaced:
##
##   database      Production runs PostgreSQL with credentials from Vault. There
##                 is no Vault here and nothing to persist, so the throwaway
##                 cluster gets the in-memory SQLite the repository already uses
##                 for local development. Everything is lost on restart, which
##                 is the correct behaviour for a cluster that is itself thrown
##                 away.
##   URLs          The real host does not resolve here.
##   integrations  Gitea is added, because the cluster has a git server of its
##                 own and the golden path writes to it. GitHub's token is
##                 overwritten with a literal — see below.
##   catalog       Explore selects its Gitea-only template and pushes the
##                 organisation scanner a year into the future — see below.
##
## The production template stays inside the image. Explore reads its entrypoint
## and shared skeleton from the checkout seeded into Gitea, so changing a
## template and running `make try` does not require publishing Backstage first.
##
##   auth          Only the discovery URL. Backstage signs people in against
##                 Keycloak itself, so the provider, the resolver and the
##                 session handling are all the bare-metal ones; what differs is
##                 which Keycloak. The sign-in resolver matches on email, which
##                 is why the demo account scripts/explore-up.sh creates carries
##                 the address of a User the catalog already ships.
##
## ── Why the scanner is neutered rather than deleted ──────────────────────────
##
## Backstage merges `--config` files key by key, and a later file cannot remove
## a key an earlier one set. Both of these were tried against a running cluster
## and neither worked:
##
##   catalog.providers: {}            the deep merge keeps `github` underneath
##   catalog.providers.github: null   likewise; the provider still registers
##
## Loading only this file, without the two baked-in ones, does remove it — and
## breaks the frontend, which validates the config against the schema compiled
## into the app bundle (`Invalid app bundle schema`).
##
## What does work is overriding the schedule, because those are leaf values.
## The provider registers and then never runs, which for a cluster measured in
## minutes is indistinguishable from absent — and it leaves the shared config as
## the single description of what the catalog contains.
apiVersion: v1
kind: ConfigMap
metadata:
  name: backstage-explore-config
  namespace: backstage
data:
  app-config.explore.yaml: |
    app:
      title: kensan-lab Platform Portal
      baseUrl: https://backstage.127-0-0-1.sslip.io

    backend:
      ## https, not http: the frontend is served over TLS, and a page loaded
      ## over https calling an http backend is blocked as mixed content — the
      ## portal would render and then fail every request it makes.
      baseUrl: https://backstage.127-0-0-1.sslip.io
      cors:
        origin: https://backstage.127-0-0-1.sslip.io
        methods: [GET, HEAD, PATCH, POST, PUT, DELETE]
        credentials: true
      database:
        client: better-sqlite3
        connection: ':memory:'


    auth:
      providers:
        oidc:
          production:
            metadataUrl: https://auth.127-0-0-1.sslip.io/realms/kensan/.well-known/openid-configuration

    # The cluster's own git server. Present only here: bare metal has no such
    # entry, which is what keeps the template's Gitea branch from resolving
    # there. Reached over the Service rather than the gateway, so Node does not
    # need to be told about the self-signed CA for this call.
    #
    # The same server is declared twice, under both names it is known by, and
    # the second one is not redundant. Integrations are looked up by the host of
    # whatever URL is being handled:
    #
    #   gitea.127-0-0-1.sslip.io   what the template's repoUrl picker offers, so
    #                              this is the name publish:gitea resolves
    #   gitea-http...:3000         the baseUrl, so it is the name that comes back
    #                              in that step's repoContentsUrl — and the one
    #                              catalog:register is then asked about
    #
    # With only the first, the golden path publishes the repository and then
    # fails on the last step with `No integration found for host`: the service
    # exists, the pull request is open, and the entity never reaches the catalog.
    integrations:
      # Not a credential, and not read from anywhere. Nothing on this path
      # reaches GitHub: the golden path writes to the cluster's own Gitea and
      # Argo CD reads from the same place.
      #
      # The key still has to hold something. The shared config declares it as
      # `${GITHUB_TOKEN}` and the backend type-checks the value at startup: an
      # empty one does not stop the process or fail the probe, it stops the
      # catalog, scaffolder and techdocs plugins from ever initialising. The
      # portal then serves its shell, answers /healthcheck, reports Healthy to
      # Argo CD, and returns 503 for every catalog request.
      #
      # Written here as a literal rather than passed in as a Secret and an
      # environment variable, because there is no secret: a value GitHub will
      # reject, in the layer whose whole claim is that no GitHub credential
      # exists here. It also means the Deployment has one fewer thing to mount.
      github:
        - host: github.com
          token: ghp_0000000000000000000000000000000000not-a-real-token

      gitea:
        - host: gitea.127-0-0-1.sslip.io
          baseUrl: http://gitea-http.gitea.svc.cluster.local:3000
          username: ${GITEA_ADMIN_USERNAME}
          password: ${GITEA_ADMIN_PASSWORD}
        - host: gitea-http.gitea.svc.cluster.local:3000
          baseUrl: http://gitea-http.gitea.svc.cluster.local:3000
          username: ${GITEA_ADMIN_USERNAME}
          password: ${GITEA_ADMIN_PASSWORD}

    # Read by the keycloak:redirect-uri:add action. A new service's hostname has
    # to be accepted by Keycloak before anybody can sign in to it, and a
    # wildcard is refused at authorization — so it is registered as it is made.
    kensanLab:
      keycloakAdmin:
        baseUrl: http://keycloak.platform-auth-prod.svc.cluster.local:8080
        realm: kensan
        username: ${KEYCLOAK_ADMIN_USERNAME}
        password: ${KEYCLOAK_ADMIN_PASSWORD}

    catalog:
      # Arrays are replaced by the later config layer. Select the Explore-only
      # template and catalog instead of exposing the production teams to a
      # first-time visitor. `fetch:template` resolves ./skeleton relative to
      # this URL, so Create and the local image build consume the same files.
      locations:
        - type: url
          target: http://gitea-http.gitea.svc.cluster.local:3000/gitea-admin/kensan-lab/src/branch/main/backstage/templates/fastapi-template/template-explore.yaml
          rules:
            - allow: [Template]
        - type: file
          target: ./catalog/explore/*.yaml
          rules:
            - allow: [Domain, System, Group, User]
      providers:
        github:
          kensanLabApps:
            schedule:
              initialDelay: { days: 365 }
              frequency: { days: 365 }
              timeout: { minutes: 1 }
