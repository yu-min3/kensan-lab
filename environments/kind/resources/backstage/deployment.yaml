## Backstage for the explore cluster.
##
## This is the one component explore cannot follow from the shared manifests.
## The bare-metal Deployment wires in PostgreSQL credentials and a GitHub token,
## both through Secrets that External Secrets fills from Vault; explore runs
## none of that, and a Deployment whose `secretKeyRef`s point at Secrets that
## will never exist does not start at all.
##
## Everything else is copied from kubernetes/backstage/backstage-deployment.yaml
## unchanged — same image, port, probes and resource requests — so that a
## divergence here is always deliberate. Three of them:
##
##   command   adds a third --config; the other two are the ones baked into the
##             image and are still loaded first.
##   env       Secrets that scripts/explore-up.sh creates rather than ones
##             External Secrets fills from Vault, plus the credentials the
##             golden path needs here and nowhere else (Gitea, Keycloak's
##             admin). GITHUB_TOKEN is absent: bare metal reads a real token
##             from Vault, and here the key is a literal in the config above,
##             because nothing on this path reaches GitHub.
##   affinity  the bare-metal Deployment requires a node labelled
##             hardware-class=high-performance. The single kind node carries
##             that label (kind-cluster.yaml), so the rule is satisfied rather
##             than removed — but it is left out here because a one-node cluster
##             makes it meaningless either way.
##
## No securityContext, deliberately: the shared namespace enforces PSS baseline
## rather than restricted, the bare-metal Deployment sets none, and the image
## declares `USER node` — a name, not a number. Adding `runAsNonRoot` without a
## numeric `runAsUser` would leave the kubelet unable to verify the user and the
## container would never start.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backstage
  namespace: backstage
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backstage
  template:
    metadata:
      labels:
        app: backstage
    spec:
      containers:
        - name: backstage
          ## Namespaced under the repository because that is the package CI
          ## can push to — see .github/workflows/backstage-ci.yml. Bare metal
          ## pulls from the same package, but the two tags move separately:
          ## explore carries whatever the golden path needs, and production is
          ## upgraded on its own occasions (it is on v0.0.14 as this is written).
          ##
          ## v0.0.18 contains both production and Explore template entrypoints.
          ## The image is shared; app-config.explore.yaml selects the latter.
          image: ghcr.io/yu-min3/kensan-lab/backstage:v0.0.19
          imagePullPolicy: IfNotPresent
          ## The two configs baked into the image, then the explore overrides.
          ## Order matters: later files win.
          command:
            - node
            - packages/backend
            - --config
            - app-config.yaml
            - --config
            - app-config.kubernetes.yaml
            - --config
            - /explore/app-config.explore.yaml
          env:
            ## Backstage signs people in against Keycloak itself. Bare metal
            ## fills these from Vault; scripts/explore-up.sh generates them and
            ## registers the matching client on the realm it creates.
            - name: AUTH_OIDC_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: backstage-secret
                  key: AUTH_OIDC_CLIENT_ID
            - name: AUTH_OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: backstage-secret
                  key: AUTH_OIDC_CLIENT_SECRET
            - name: AUTH_SESSION_SECRET
              valueFrom:
                secretKeyRef:
                  name: backstage-secret
                  key: AUTH_SESSION_SECRET
            ## The golden path writes to the cluster's own git server and then
            ## teaches Keycloak to accept the hostname it just created. Neither
            ## credential exists on bare metal, where the template takes its
            ## GitHub branch instead.
            - name: GITEA_ADMIN_USERNAME
              valueFrom:
                secretKeyRef:
                  name: backstage-explore-gitea
                  key: username
            - name: GITEA_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: backstage-explore-gitea
                  key: password
            - name: KEYCLOAK_ADMIN_USERNAME
              valueFrom:
                secretKeyRef:
                  name: backstage-explore-keycloak
                  key: username
            - name: KEYCLOAK_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: backstage-explore-keycloak
                  key: password
            ## Backstage fetches Keycloak's discovery document over HTTPS, and
            ## that certificate is signed by a CA this cluster invented. Node
            ## reads extra roots from this variable and nowhere else — without
            ## it sign-in fails at startup with UNABLE_TO_VERIFY_LEAF_SIGNATURE,
            ## which reads like a Keycloak fault rather than a trust one.
            - name: NODE_EXTRA_CA_CERTS
              value: /etc/ssl/explore/ca.crt
          ports:
            - containerPort: 7007
              name: http
          volumeMounts:
            - name: explore-config
              mountPath: /explore
              readOnly: true
            - name: explore-ca
              mountPath: /etc/ssl/explore
              readOnly: true
          resources:
            requests:
              memory: "256Mi"
              cpu: "200m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
          livenessProbe:
            httpGet:
              path: /healthcheck
              port: 7007
            initialDelaySeconds: 60
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthcheck
              port: 7007
            initialDelaySeconds: 30
            periodSeconds: 10
      volumes:
        - name: explore-config
          configMap:
            name: backstage-explore-config
        ## See resources/tls-selfsigned.yaml for why a certificate nobody serves
        ## is how the CA bundle crosses a namespace.
        - name: explore-ca
          secret:
            secretName: backstage-explore-ca-tls
            items:
              - key: ca.crt
                path: ca.crt
