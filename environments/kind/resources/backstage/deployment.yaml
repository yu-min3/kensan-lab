## Backstage for the explore cluster.
##
## This is the one component explore cannot follow from the shared manifests.
## The bare-metal Deployment wires in PostgreSQL credentials and a GitHub token,
## both through Secrets that External Secrets fills from Vault; explore runs
## none of that, and a Deployment whose `secretKeyRef`s point at Secrets that
## will never exist does not start at all.
##
## Everything else is copied from kubernetes/backstage/backstage-deployment.yaml
## unchanged — same image, port, probes and resource requests — so that a
## divergence here is always deliberate. Three of them:
##
##   command   adds a third --config; the other two are the ones baked into the
##             image and are still loaded first.
##   env       GITHUB_TOKEN is a literal placeholder rather than a Secret. The
##             explore config empties the integrations list, so nothing ever
##             authenticates with it; it exists only so that config substitution
##             resolves.
##   affinity  the bare-metal Deployment requires a node labelled
##             hardware-class=high-performance. The single kind node carries
##             that label (kind-cluster.yaml), so the rule is satisfied rather
##             than removed — but it is left out here because a one-node cluster
##             makes it meaningless either way.
##
## No securityContext, deliberately: the shared namespace enforces PSS baseline
## rather than restricted, the bare-metal Deployment sets none, and the image
## declares `USER node` — a name, not a number. Adding `runAsNonRoot` without a
## numeric `runAsUser` would leave the kubelet unable to verify the user and the
## container would never start.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backstage
  namespace: backstage
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backstage
  template:
    metadata:
      labels:
        app: backstage
    spec:
      containers:
        - name: backstage
          image: ghcr.io/yu-min3/backstage:v0.0.12
          imagePullPolicy: IfNotPresent
          ## The two configs baked into the image, then the explore overrides.
          ## Order matters: later files win.
          command:
            - node
            - packages/backend
            - --config
            - app-config.yaml
            - --config
            - app-config.kubernetes.yaml
            - --config
            - /explore/app-config.explore.yaml
          env:
            - name: GITHUB_TOKEN
              value: "unused-in-explore"
          ports:
            - containerPort: 7007
              name: http
          volumeMounts:
            - name: explore-config
              mountPath: /explore
              readOnly: true
          resources:
            requests:
              memory: "256Mi"
              cpu: "200m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
          livenessProbe:
            httpGet:
              path: /healthcheck
              port: 7007
            initialDelaySeconds: 60
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthcheck
              port: 7007
            initialDelaySeconds: 30
            periodSeconds: 10
      volumes:
        - name: explore-config
          configMap:
            name: backstage-explore-config
