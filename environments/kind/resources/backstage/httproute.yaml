## Backstage on the explore hostname — the substitute for
## kubernetes/backstage/httproute.yaml, which names the real domain.
##
## One of the three permanent substitutions: it exists only because a hostname
## is hardcoded in a raw manifest. See
## environments/kind/README.md#why-the-substitutions-are-permanent.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: backstage-route
  namespace: backstage
  annotations:
    argocd.argoproj.io/sync-wave: "4"
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: gateway-explore
      namespace: istio-system
  hostnames:
    - "backstage.127-0-0-1.sslip.io"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - group: ""
          kind: Service
          name: backstage
          port: 7007
          weight: 1
