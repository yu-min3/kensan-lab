# app-demo — values for charts/app-base, the same chart the real apps use.
# Chart config: environments/kind/applications/templates/demo-app.yaml
#
# Nothing here is explore-specific machinery: it is an ordinary app-base values
# file. The three things a fork would have to change are the image, the
# hostname, and turning the GHCR pull secret off (that one is backed by Vault,
# which explore does not run until Phase 3).

nameOverride: demo

# The output of the golden path, not a stand-in for it.
#
# This image is the template's own skeleton, rendered the way the scaffolder
# renders it and pushed by .github/workflows/template-ci.yml. The app a visitor
# reaches at demo.127-0-0-1.sslip.io is therefore the thing they would get by
# pressing Create in the portal: same FastAPI service, same Dockerfile, same
# /health and /metrics, deployed by the same chart. Nothing about the demo is
# arranged for the demo.
#
# Public and multi-arch, so it resolves on Apple Silicon as well as on an amd64
# runner. The real applications are multi-arch too; theirs are private and
# pulled through an ExternalSecret backed by Vault, which is why they are absent
# — architecture is not the reason.
image:
  repository: ghcr.io/yu-min3/kensan-lab/explore-demo
  tag: v0.1.0

ports:
  http: 8000

probes:
  # app/main.py serves /health; the chart defaults to /healthz.
  path: /health

# Bare metal pulls from a private GHCR through an ExternalSecret backed by
# Vault. Explore has no Vault, and the image is public anyway.
ghcrPullSecret:
  enabled: false

# stakater/reloader is not part of the explore slice; the annotation alone is
# inert, but leaving it on would suggest a controller is watching it.
reloader: false

httproute:
  enabled: true
  hostnames:
    - demo.127-0-0-1.sslip.io
  gateway:
    name: gateway-explore
    namespace: istio-system

# The point of the whole SSO phase, stated in one flag. The application has no
# authentication code and no idea it is protected: the gateway sends every
# request for this hostname to oauth2-proxy first, and only a request carrying a
# valid Keycloak session reaches the pod. This line and a ReferenceGrant are the
# entire cost — and since this app is the golden path's own output, that is the
# cost to every service scaffolded from it.
auth:
  gatewayOAuth2:
    enabled: true

resources:
  requests:
    cpu: 25m
    memory: 32Mi
  limits:
    memory: 128Mi
