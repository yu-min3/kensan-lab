# app-demo — values for charts/app-base, the same chart the real apps use.
# Chart config: environments/kind/applications/templates/demo-app.yaml
#
# Nothing here is explore-specific machinery: it is an ordinary app-base values
# file. The three things a fork would have to change are the image, the
# hostname, and turning the GHCR pull secret off (that one is backed by Vault,
# which explore does not run until Phase 3).

nameOverride: demo

# podinfo is public and multi-arch, so this resolves on Apple Silicon as well as
# on an amd64 runner. The real applications are multi-arch too, but their
# images are private and pulled through an ExternalSecret backed by Vault,
# which explore does not run until Phase 3 — that, not architecture, is why
# they are absent.
image:
  repository: ghcr.io/stefanprodan/podinfo
  tag: 6.9.2

ports:
  http: 9898

probes:
  path: /healthz

# podinfo's image declares `USER app` — a name, not a number. The chart asks for
# runAsNonRoot, and the kubelet cannot resolve a username to a UID without the
# image's /etc/passwd, so it refuses to start the container:
#
#   container has runAsNonRoot and image has non-numeric user (app),
#   cannot verify user is non-root
#
# 100:101 is what `app` resolves to inside the image. Stated numerically here
# rather than relaxing runAsNonRoot in the chart, which every real app depends
# on. Any image whose USER is a name needs the same two lines.
securityContext:
  runAsUser: 100
  runAsGroup: 101

# Bare metal pulls from a private GHCR through an ExternalSecret backed by
# Vault. Explore has no Vault, and the image is public anyway.
ghcrPullSecret:
  enabled: false

# stakater/reloader is not part of the explore slice; the annotation alone is
# inert, but leaving it on would suggest a controller is watching it.
reloader: false

httproute:
  enabled: true
  hostnames:
    - demo.127-0-0-1.sslip.io
  gateway:
    name: gateway-explore
    namespace: istio-system

resources:
  requests:
    cpu: 25m
    memory: 32Mi
  limits:
    memory: 128Mi
