# app-demo — values for charts/app-base, the same chart the real apps use.
# Chart config: environments/kind/applications/templates/demo-app.yaml
#
# Nothing here is explore-specific machinery: it is an ordinary app-base values
# file. The three things a fork would have to change are the image, the
# hostname, and turning the GHCR pull secret off (that one is backed by Vault,
# which explore does not run until Phase 3).

nameOverride: demo

# A built-in preview of the template. `make try` builds it from this checkout
# and loads it straight into kind so there is an app before the visitor creates
# one. Golden Path applications take the stricter route: their own Gitea
# repository is tested, built and pushed to the disposable Explore registry.
image:
  repository: kensan-lab/explore-template
  tag: local

ports:
  http: 8000

probes:
  # app/main.py serves /health; the chart defaults to /healthz.
  path: /health

env:
  - name: APP_NAME
    value: demo
  - name: APP_THEME
    value: day
  - name: APP_MESSAGE
    value: This app was already here. Create yours in Backstage.

# Not an explore-specific workaround — these are the two lines the template's
# own deploy/values.yaml ships, and for the same reason. The skeleton's
# Dockerfile ends with `USER appuser`, a name rather than a number, and the
# chart asks for runAsNonRoot; the kubelet cannot resolve a username to a UID
# without reading the image's /etc/passwd, so it refuses to start the container:
#
#   container has runAsNonRoot and image has non-numeric user (appuser),
#   cannot verify user is non-root
#
# Stating the UID numerically is what the template tells a developer to do, so
# explore does the same. A `USER 1000:1000` in the skeleton's Dockerfile would
# remove the need for both copies.
securityContext:
  runAsUser: 1000
  runAsGroup: 1000

# This particular image is loaded directly into kind. Generated applications
# also need no pull secret because their registry is inside the cluster.
ghcrPullSecret:
  enabled: false

# stakater/reloader is not part of the explore slice; the annotation alone is
# inert, but leaving it on would suggest a controller is watching it.
reloader: false

httproute:
  enabled: true
  hostnames:
    - demo.127-0-0-1.sslip.io
  gateway:
    name: gateway-explore
    namespace: istio-system

# The point of the whole SSO phase, stated in one flag. The application has no
# authentication code and no idea it is protected: the gateway sends every
# request for this hostname to oauth2-proxy first, and only a request carrying a
# valid Keycloak session reaches the pod. This line and a ReferenceGrant are the
# entire cost — and since this app is the golden path's own output, that is the
# cost to every service scaffolded from it.
auth:
  gatewayOAuth2:
    enabled: true

resources:
  requests:
    cpu: 25m
    memory: 32Mi
  limits:
    memory: 128Mi
