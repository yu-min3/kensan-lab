# Dedicated runtime auth, initial generation and cross-node PVC locking verified.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: kensan-project-watch
  namespace: app-kensan
spec:
  suspend: false
  schedule: "0 8-22/2 * * *"
  timeZone: Asia/Tokyo
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 600
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 660
      template:
        metadata:
          labels:
            app.kubernetes.io/name: kensan-project-watch
            app.kubernetes.io/part-of: kensan
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          imagePullSecrets:
            - name: ghcr-pull-secret
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            fsGroup: 65532
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: project-watch
              # Release this version before removing suspend. Keep aligned with app values.
              image: ghcr.io/yu-min3/kensan:v0.3.18
              command: ["/usr/local/bin/project-watch"]
              env:
                - name: KENSAN_DATA_DIR
                  value: /data
                - name: TZ
                  value: Asia/Tokyo
                - name: KENSAN_AGENT_URL
                  value: https://192.168.0.113:8791
                - name: KENSAN_AGENT_CA_FILE
                  value: /etc/agent-ca/ca.crt
                - name: KENSAN_AGENT_TOKEN_URL
                  value: https://auth.yu-mins.com/realms/kensan/protocol/openid-connect/token
                - name: KENSAN_AGENT_CLIENT_ID
                  value: kensan-agent-runtime
                - name: KENSAN_AGENT_CLIENT_SECRET_FILE
                  value: /etc/agent-credentials/client-secret
              resources:
                requests:
                  cpu: 25m
                  memory: 64Mi
                limits:
                  memory: 256Mi
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
                readOnlyRootFilesystem: true
              volumeMounts:
                - name: workspace
                  mountPath: /data
                - name: agent-ca
                  mountPath: /etc/agent-ca
                  readOnly: true
                - name: agent-credentials
                  mountPath: /etc/agent-credentials
                  readOnly: true
          volumes:
            - name: workspace
              persistentVolumeClaim:
                claimName: kensan-workspace
            - name: agent-ca
              configMap:
                name: kensan-agent-runtime-ca
            - name: agent-credentials
              secret:
                secretName: kensan-agent-runtime
                defaultMode: 0440
