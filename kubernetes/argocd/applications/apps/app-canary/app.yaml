# Argo CD Application for canary, opened as a pull request against
# the platform repository by the scaffolder.
#
# Three sources, the same shape every application on this platform uses:
#   1. the platform's chart, with the values file from this repository
#   2. this repository again, as a `ref` so that $values resolves
#   3. this repository's raw manifests (namespace, PVC)
#
# The application owns its namespace and its deployment values; the platform
# owns the chart and this Application CR. That split is the point — see
# docs/architecture/argocd.md.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: app-canary
  namespace: argocd
  annotations:
    # The namespace and anything stateful in it must survive this Application
    # being removed from Git. Prune=false has to sit on the resources as well
    # as here — see the platform's own apps for the pattern.
    argocd.argoproj.io/sync-options: Prune=false
spec:
  project: app-project

  sources:
    - repoURL: https://github.com/yu-min3/kensan-lab
      targetRevision: main
      path: charts/app-base
      helm:
        releaseName: canary
        valueFiles:
          - $values/kubernetes/apps/app-canary/values.yaml
    - repoURL: https://github.com/yu-min3/kensan-lab
      targetRevision: main
      ref: values
    - repoURL: https://github.com/yu-min3/kensan-lab
      targetRevision: main
      path: kubernetes/apps/app-canary/resources
      directory:
        recurse: false
        include: '*.yaml'

  destination:
    server: https://kubernetes.default.svc
    # ADR-006: one namespace per application, created by deploy/resources.
    namespace: app-canary

  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
