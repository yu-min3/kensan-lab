apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: app-koubou
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-options: Prune=false
spec:
  project: app-project
  sources:
  - repoURL: https://github.com/yu-min3/kensan-lab
    # Review/merge the generic app-base extension before any manual sync.
    targetRevision: 8b56ce2eacb34131b059b7563db7514fffd3fb77
    path: charts/app-base
    helm:
      releaseName: app-koubou
      valueFiles:
      - $app/deploy/lan-entry-values.yaml
  - repoURL: https://github.com/yu-min3/koubou
    targetRevision: d5154ef0cb9b280cbbc35ff932bb115ddc7f51a7
    ref: app
  - repoURL: https://github.com/yu-min3/koubou
    targetRevision: d5154ef0cb9b280cbbc35ff932bb115ddc7f51a7
    path: deploy/app-entry-resources
  destination:
    server: https://kubernetes.default.svc
    namespace: app-koubou
  # Manual sync only after chart review, repository access, SSO and DNS checks.
  syncPolicy:
    syncOptions:
    - CreateNamespace=false
    - ServerSideApply=true
