apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: app-koubou
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-options: Prune=false
spec:
  project: app-project
  sources:
  - repoURL: https://github.com/yu-min3/kensan-lab
    # Review/merge the generic app-base extension before any manual sync.
    targetRevision: 5963e6752505d44d8acfa8cc9e13c51c1c5669fe
    path: charts/app-base
    helm:
      releaseName: app-koubou
      valueFiles:
      - $app/deploy/lan-entry-values.yaml
  - repoURL: https://github.com/yu-min3/koubou
    targetRevision: 995b67a0b2da2f8ddfc76cdfddef945ab2f48e0a
    ref: app
  - repoURL: https://github.com/yu-min3/koubou
    targetRevision: 995b67a0b2da2f8ddfc76cdfddef945ab2f48e0a
    path: deploy/app-entry-resources
  destination:
    server: https://kubernetes.default.svc
    namespace: app-koubou
  # Manual sync only after chart review, repository access, SSO and DNS checks.
  syncPolicy:
    syncOptions:
    - CreateNamespace=false
    - ServerSideApply=true
