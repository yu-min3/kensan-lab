# Generic external-service registry, owned and approved by Platform operators.
# Vault holds a complete app-config overlay with backend.auth.externalAccess.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: backstage-service-access
  namespace: backstage
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: backstage-service-access
    creationPolicy: Owner
  data:
    - secretKey: config.yaml
      remoteRef:
        key: backstage/service-access
        property: config
---
# Secret values are injected separately from the YAML registry. The registry
# references environment keys, so YAML parse errors cannot print literal tokens.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: backstage-service-credentials
  namespace: backstage
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: backstage-service-credentials
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: backstage/service-credentials
