# oauth2-proxy が返す X-Auth-Request-Access-Token を Keycloak JWKS で検証する。
#
# 動作:
# - oauth2-proxy が UI 経路で access token をidentity headerとして返す。本 RAが検証して
#   request.auth.claims を populate → AuthorizationPolicy ALLOW の `when` 句で
#   groups claim を判定できるようになる。
# - JWT が無い request (Vault CLI の X-Vault-Token、ArgoCD CLI の独自 JWT 等) は
#   request.auth.claims が空のまま素通り。bypass host (vault/argocd 等) は
#   ALLOW policy 側で claim 不要 rule で許可する。
#
# Authorization header はJWT抽出元にしない。各appが発行したtokenをそのまま保持する。
apiVersion: security.istio.io/v1
kind: RequestAuthentication
metadata:
  name: gateway-platform-keycloak-jwt
  namespace: istio-system
spec:
  targetRef:
    group: gateway.networking.k8s.io
    kind: Gateway
    name: gateway-platform
  jwtRules:
    - issuer: "https://auth.yu-mins.com/realms/kensan"
      jwksUri: "https://auth.yu-mins.com/realms/kensan/protocol/openid-connect/certs"
      fromHeaders:
        - name: x-auth-request-access-token
      forwardOriginalToken: false
    # Keycloak admin console (realm master) のトークンも検証可能にする。
    # これが無いと console の admin API call が "Jwt issuer is not configured"
    # で 401 になる (RA は JWT 持ちリクエストの issuer 未登録を reject するため)。
    # master realm トークンには platform-admin groups claim が無いので、
    # Category 2/3 host (groups claim 必須) には通らない。
    - issuer: "https://auth.yu-mins.com/realms/master"
      jwksUri: "https://auth.yu-mins.com/realms/master/protocol/openid-connect/certs"
      fromHeaders:
        - name: x-auth-request-access-token
      forwardOriginalToken: false
