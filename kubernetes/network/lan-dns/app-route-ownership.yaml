# DNS trusts hostnames in routes. App namespace names define host ownership;
# labels cannot bypass this contract. Existing kensan public alias is retained.
#
# app-{name} owns {name}.app.yu-min3.com and {name}-{label}.app.yu-min3.com
# (one extra DNS label, e.g. kensan-markport). The second form is unambiguous
# only because app names cannot contain hyphens (app-namespace-name below):
# otherwise app-kensan-markport could claim the same host as app-kensan.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: app-httproute-ownership
  annotations:
    argocd.argoproj.io/sync-wave: '-1'
spec:
  failurePolicy: Fail
  matchConstraints:
    matchPolicy: Equivalent
    resourceRules:
    - apiGroups: [gateway.networking.k8s.io]
      apiVersions: [v1]
      operations: [CREATE, UPDATE]
      resources: [httproutes]
      scope: Namespaced
  matchConditions:
  - name: app-namespace
    expression: "request.namespace.startsWith('app-')"
  variables:
  - name: app
    expression: "request.namespace.substring(4)"
  validations:
  - expression: >-
      has(object.spec.hostnames) &&
      size(object.spec.hostnames) > 0 &&
      object.spec.hostnames.all(h,
        h == variables.app + '.app.yu-min3.com' ||
        h.matches('^' + variables.app +
          '-[a-z0-9]([-a-z0-9]*[a-z0-9])?\\.app\\.yu-min3\\.com$') ||
        (request.namespace == 'app-kensan' && h == 'kensan.yu-mins.com'))
    message: "App route host must belong to its app namespace"
  - expression: >-
      has(object.spec.parentRefs) &&
      size(object.spec.parentRefs) > 0 &&
      object.spec.parentRefs.all(p,
        p.name == 'gateway-prod' &&
        has(p.namespace) && p.namespace == 'istio-system' &&
        (!has(p.group) || p.group == 'gateway.networking.k8s.io') &&
        (!has(p.kind) || p.kind == 'Gateway'))
    message: "App routes must use istio-system/gateway-prod"
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: app-httproute-ownership
  annotations:
    argocd.argoproj.io/sync-wave: '-1'
spec:
  policyName: app-httproute-ownership
  validationActions: [Deny]
---
# App names are single words so that {name}-{label} hosts stay unambiguous.
# Existing app namespaces (canary, kensan, konro, koubou) already comply.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: app-namespace-name
  annotations:
    argocd.argoproj.io/sync-wave: '-1'
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
    - apiGroups: ['']
      apiVersions: [v1]
      operations: [CREATE]
      resources: [namespaces]
  matchConditions:
  - name: app-namespace
    expression: "object.metadata.name.startsWith('app-')"
  validations:
  - expression: "object.metadata.name.matches('^app-[a-z0-9]+$')"
    message: "App namespace must be app-{name} with no further hyphen"
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: app-namespace-name
  annotations:
    argocd.argoproj.io/sync-wave: '-1'
spec:
  policyName: app-namespace-name
  validationActions: [Deny]
