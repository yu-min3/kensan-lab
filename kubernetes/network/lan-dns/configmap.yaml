apiVersion: v1
kind: ConfigMap
metadata:
  name: lan-dns
  namespace: lan-dns
data:
  Corefile: |
    .:5353 {
        errors
        health :8080
        ready :8181
        # External SSO alias; App/Platform names come from HTTPRoutes.
        hosts {
            192.168.0.242 auth.yu-mins.com
            fallthrough
        }
        k8s_gateway app.yu-min3.com platform.yu-min3.com {
            resources HTTPRoute
            gatewayClasses istio
            ttl 30
        }
        forward . 9.9.9.9 149.112.112.112
        cache 30
        reload
        loop
    }
