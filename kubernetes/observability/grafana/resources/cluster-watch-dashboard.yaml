apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-cluster-watch-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
    grafana_folder: "Platform"
data:
  cluster-watch.json: |
    {
      "uid": "cluster-watch",
      "title": "Cluster Watch",
      "description": "常設用。Podの状態をJobも含めて表示し、ノードReady・CPU/メモリ・永続ストレージ・HTTPS・重要アラートでクラスタの状態を確認。",
      "schemaVersion": 39,
      "version": 2,
      "editable": true,
      "id": null,
      "tags": [
        "platform",
        "watch"
      ],
      "refresh": "1m",
      "time": {
        "from": "now-1h",
        "to": "now"
      },
      "timezone": "browser",
      "links": [
        {
          "title": "Cluster Health",
          "url": "/d/cluster-health",
          "type": "link",
          "targetBlank": false
        },
        {
          "title": "Control Plane Health",
          "url": "/d/controlplane-health",
          "type": "link",
          "targetBlank": false
        },
        {
          "title": "Longhorn",
          "url": "/dashboards?query=Longhorn",
          "type": "link",
          "targetBlank": false
        }
      ],
      "panels": [
        {
          "id": 1,
          "title": "監視取得",
          "type": "stat",
          "gridPos": {
            "x": 0,
            "y": 0,
            "w": 6,
            "h": 3
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "description": "",
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "(vector(1) and on() (((((cluster_watch:ksm_healthy:bool == 1) and on() (time() - timestamp(cluster_watch:ksm_healthy:bool) < 120)) and on() (count(max by(namespace,pod,uid,phase)(kube_pod_status_phase == 1)) == count(max by(namespace,pod,uid)(kube_pod_info))) and on() (time() - min(timestamp(kube_pod_status_phase)) < 120)) and on() ((count((max by(namespace,pod,uid)(kube_pod_status_ready{condition=\"true\"})) and on(namespace,pod,uid) (max by(namespace,pod,uid)(kube_pod_status_phase{phase=\"Running\"} == 1))) or vector(0)) == (count(max by(namespace,pod,uid)(kube_pod_status_phase{phase=\"Running\"} == 1)) or vector(0))) and on() (vector(1) unless on() ((time()-timestamp(kube_pod_status_ready{condition=\"true\"}) >= 120) and on(namespace,pod,uid) (max by(namespace,pod,uid)(kube_pod_status_phase{phase=\"Running\"} == 1))))) and on() ((((cluster_watch:ksm_healthy:bool == 1) and on() (time() - timestamp(cluster_watch:ksm_healthy:bool) < 120)) and on() (min(up{job=\"node-exporter\"}) == 1) and on() (count(up{job=\"node-exporter\"}) == count(max by(node)(kube_node_info)))) and on() (count(count by(instance)(rate(node_cpu_seconds_total{mode=\"idle\"}[5m]))) == count(max by(node)(kube_node_info))) and on() (time()-min(timestamp(node_cpu_seconds_total{mode=\"idle\"})) < 120)) and on() ((((cluster_watch:ksm_healthy:bool == 1) and on() (time() - timestamp(cluster_watch:ksm_healthy:bool) < 120)) and on() (min(up{job=\"node-exporter\"}) == 1) and on() (count(up{job=\"node-exporter\"}) == count(max by(node)(kube_node_info)))) and on() (count(node_memory_MemAvailable_bytes) == count(max by(node)(kube_node_info))) and on() (count(node_memory_MemTotal_bytes) == count(max by(node)(kube_node_info))) and on() (min(node_memory_MemTotal_bytes)>0) and on() (time()-min(timestamp(node_memory_MemAvailable_bytes)) < 120) and on() (time()-min(timestamp(node_memory_MemTotal_bytes)) < 120)) and on() (((cluster_watch:ksm_healthy:bool == 1) and on() (time() - timestamp(cluster_watch:ksm_healthy:bool) < 120)) and on() (count(max by(namespace,persistentvolumeclaim)(kubelet_volume_stats_used_bytes / (kubelet_volume_stats_capacity_bytes > 0))) > 0) and on() (time()-min(timestamp(kubelet_volume_stats_used_bytes)) < 120) and on() (time()-min(timestamp(kubelet_volume_stats_capacity_bytes)) < 120) and on() (min(up{job=\"kubelet\",metrics_path=\"/metrics\"}) == 1) and on() (count(up{job=\"kubelet\",metrics_path=\"/metrics\"}) == count(max by(node)(kube_node_info))) unless on() (max by(namespace,persistentvolumeclaim)(kube_pod_spec_volumes_persistentvolumeclaims_info and on(namespace,pod,uid)(kube_pod_status_phase{phase=\"Running\"}==1)) unless on(namespace,persistentvolumeclaim) max by(namespace,persistentvolumeclaim)(kubelet_volume_stats_used_bytes / (kubelet_volume_stats_capacity_bytes > 0)))) and on() (((cluster_watch:ksm_healthy:bool == 1) and on() (time() - timestamp(cluster_watch:ksm_healthy:bool) < 120)) and on() (max((time()-prometheus_rule_group_last_evaluation_timestamp_seconds)/(2*prometheus_rule_group_interval_seconds+60))<1 and on() (count(prometheus_rule_group_last_evaluation_timestamp_seconds)==count(prometheus_rule_group_interval_seconds)) and on() (time()-min(timestamp(prometheus_rule_group_last_evaluation_timestamp_seconds))<120))) and on() ((cluster_watch:https_healthy:bool == 1) and on() (time()-timestamp(cluster_watch:https_healthy:bool)<120)))) or vector(0)",
              "refId": "A",
              "instant": true,
              "format": "time_series"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "noValue": "確認不能",
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 1
                  }
                ]
              },
              "mappings": [
                {
                  "type": "value",
                  "options": {
                    "1": {
                      "text": "取得正常",
                      "color": "green"
                    },
                    "0": {
                      "text": "一部確認不能",
                      "color": "orange"
                    },
                    "-1": {
                      "text": "確認不能",
                      "color": "gray"
                    }
                  }
                }
              ]
            },
            "overrides": []
          },
          "options": {
            "colorMode": "value",
            "graphMode": "none",
            "textMode": "value",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            }
          }
        },
        {
          "id": 3,
          "title": "ノード",
          "type": "stat",
          "gridPos": {
            "x": 6,
            "y": 0,
            "w": 6,
            "h": 3
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "description": "",
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "(((sum(kube_node_status_condition{condition=\"Ready\",status=\"true\"}))) and on() ((cluster_watch:ksm_healthy:bool == 1) and on() (time() - timestamp(cluster_watch:ksm_healthy:bool) < 120))) or vector(-1)",
              "refId": "A",
              "instant": true,
              "format": "time_series",
              "legendFormat": "Ready"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "(((count(max by(node)(kube_node_info)))) and on() ((cluster_watch:ksm_healthy:bool == 1) and on() (time() - timestamp(cluster_watch:ksm_healthy:bool) < 120))) or vector(-1)",
              "refId": "B",
              "instant": true,
              "format": "time_series",
              "legendFormat": "全体"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "noValue": "確認不能",
              "color": {
                "mode": "fixed",
                "fixedColor": "text"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 1
                  }
                ]
              },
              "mappings": [
                {
                  "type": "value",
                  "options": {
                    "-1": {
                      "text": "確認不能",
                      "color": "gray"
                    }
                  }
                }
              ]
            },
            "overrides": []
          },
          "options": {
            "colorMode": "value",
            "graphMode": "none",
            "textMode": "value_and_name",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "orientation": "horizontal",
            "text": {
              "valueSize": 30,
              "titleSize": 12
            }
          }
        },
        {
          "id": 4,
          "title": "HTTPS異常",
          "type": "stat",
          "gridPos": {
            "x": 12,
            "y": 0,
            "w": 6,
            "h": 3
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "description": "",
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "(cluster_watch:https_count:current and on() (time() - timestamp(cluster_watch:https_count:current) < 120)) or vector(-1)",
              "refId": "A",
              "instant": true,
              "format": "time_series"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "noValue": "確認不能",
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 1
                  }
                ]
              },
              "mappings": [
                {
                  "type": "value",
                  "options": {
                    "-1": {
                      "text": "確認不能",
                      "color": "gray"
                    }
                  }
                }
              ]
            },
            "overrides": []
          },
          "options": {
            "colorMode": "value",
            "graphMode": "none",
            "textMode": "value",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            }
          }
        },
        {
          "id": 20,
          "title": "重要アラート",
          "type": "stat",
          "gridPos": {
            "x": 18,
            "y": 0,
            "w": 6,
            "h": 3
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "description": "warning/criticalの発火系列数。通知の未対応件数ではない。Watchdogなどseverity=noneは除外。",
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "(((count(ALERTS{alertstate=\"firing\",severity=~\"warning|critical\"})) or vector(0)) and on() (((cluster_watch:ksm_healthy:bool == 1) and on() (time() - timestamp(cluster_watch:ksm_healthy:bool) < 120)) and on() (max((time()-prometheus_rule_group_last_evaluation_timestamp_seconds)/(2*prometheus_rule_group_interval_seconds+60))<1 and on() (count(prometheus_rule_group_last_evaluation_timestamp_seconds)==count(prometheus_rule_group_interval_seconds)) and on() (time()-min(timestamp(prometheus_rule_group_last_evaluation_timestamp_seconds))<120)))) or vector(-1)",
              "refId": "A",
              "instant": true,
              "format": "time_series"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "noValue": "確認不能",
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "gray",
                    "value": null
                  },
                  {
                    "color": "green",
                    "value": 0
                  },
                  {
                    "color": "red",
                    "value": 1
                  }
                ]
              },
              "mappings": [
                {
                  "type": "value",
                  "options": {
                    "-1": {
                      "text": "確認不能",
                      "color": "gray"
                    }
                  }
                }
              ]
            },
            "overrides": []
          },
          "options": {
            "colorMode": "value",
            "graphMode": "none",
            "textMode": "value",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "orientation": "horizontal"
          }
        },
        {
          "id": 11,
          "title": "稼働",
          "type": "stat",
          "gridPos": {
            "x": 0,
            "y": 3,
            "w": 4,
            "h": 3
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "description": "RunningかつReadyの稼働Pod数と、全phaseのPod総数。Jobも含む。",
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "(((count((max by(namespace,pod,uid)(kube_pod_status_phase{phase=\"Running\"} == 1)) and on(namespace,pod,uid) (max by(namespace,pod,uid)(kube_pod_status_ready{condition=\"true\"} == 1)))) or vector(0)) and on() ((((cluster_watch:ksm_healthy:bool == 1) and on() (time() - timestamp(cluster_watch:ksm_healthy:bool) < 120)) and on() (count(max by(namespace,pod,uid,phase)(kube_pod_status_phase == 1)) == count(max by(namespace,pod,uid)(kube_pod_info))) and on() (time() - min(timestamp(kube_pod_status_phase)) < 120)) and on() ((count((max by(namespace,pod,uid)(kube_pod_status_ready{condition=\"true\"})) and on(namespace,pod,uid) (max by(namespace,pod,uid)(kube_pod_status_phase{phase=\"Running\"} == 1))) or vector(0)) == (count(max by(namespace,pod,uid)(kube_pod_status_phase{phase=\"Running\"} == 1)) or vector(0))) and on() (vector(1) unless on() ((time()-timestamp(kube_pod_status_ready{condition=\"true\"}) >= 120) and on(namespace,pod,uid) (max by(namespace,pod,uid)(kube_pod_status_phase{phase=\"Running\"} == 1)))))) or vector(-1)",
              "refId": "A",
              "instant": true,
              "format": "time_series",
              "legendFormat": "Ready"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "(((count(max by(namespace,pod,uid)(kube_pod_info))) or vector(0)) and on() (((cluster_watch:ksm_healthy:bool == 1) and on() (time() - timestamp(cluster_watch:ksm_healthy:bool) < 120)) and on() (count(max by(namespace,pod,uid,phase)(kube_pod_status_phase == 1)) == count(max by(namespace,pod,uid)(kube_pod_info))) and on() (time() - min(timestamp(kube_pod_status_phase)) < 120))) or vector(-1)",
              "refId": "B",
              "instant": true,
              "format": "time_series",
              "legendFormat": "全Pod"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "noValue": "確認不能",
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "gray",
                    "value": null
                  },
                  {
                    "color": "green",
                    "value": 0
                  }
                ]
              },
              "mappings": [
                {
                  "type": "value",
                  "options": {
                    "-1": {
                      "text": "確認不能",
                      "color": "gray"
                    }
                  }
                }
              ]
            },
            "overrides": []
          },
          "options": {
            "colorMode": "value",
            "graphMode": "none",
            "textMode": "value_and_name",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "orientation": "horizontal",
            "text": {
              "valueSize": 30,
              "titleSize": 12
            }
          }
        },
        {
          "id": 12,
          "title": "未Ready",
          "type": "stat",
          "gridPos": {
            "x": 4,
            "y": 3,
            "w": 4,
            "h": 3
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "description": "RunningかつReady=falseのPod。正常稼働とは別に表示。Jobも含む。",
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "(((count((max by(namespace,pod,uid)(kube_pod_status_phase{phase=\"Running\"} == 1)) and on(namespace,pod,uid) (max by(namespace,pod,uid)(kube_pod_status_ready{condition=\"true\"} == 0)))) or vector(0)) and on() ((((cluster_watch:ksm_healthy:bool == 1) and on() (time() - timestamp(cluster_watch:ksm_healthy:bool) < 120)) and on() (count(max by(namespace,pod,uid,phase)(kube_pod_status_phase == 1)) == count(max by(namespace,pod,uid)(kube_pod_info))) and on() (time() - min(timestamp(kube_pod_status_phase)) < 120)) and on() ((count((max by(namespace,pod,uid)(kube_pod_status_ready{condition=\"true\"})) and on(namespace,pod,uid) (max by(namespace,pod,uid)(kube_pod_status_phase{phase=\"Running\"} == 1))) or vector(0)) == (count(max by(namespace,pod,uid)(kube_pod_status_phase{phase=\"Running\"} == 1)) or vector(0))) and on() (vector(1) unless on() ((time()-timestamp(kube_pod_status_ready{condition=\"true\"}) >= 120) and on(namespace,pod,uid) (max by(namespace,pod,uid)(kube_pod_status_phase{phase=\"Running\"} == 1)))))) or vector(-1)",
              "refId": "A",
              "instant": true,
              "format": "time_series"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "noValue": "確認不能",
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
