      "panels": [
        {
          "type": "text",
          "title": "",
          "gridPos": {
            "x": 0,
            "y": 0,
            "w": 18,
            "h": 2
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [],
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "noValue": "◇ 未取得",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "gray",
                    "value": null
                  },
                  {
                    "color": "green",
                    "value": 0
                  },
                  {
                    "color": "orange",
                    "value": 75
                  },
                  {
                    "color": "red",
                    "value": 90
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "mode": "markdown",
            "content": "**CLUSTER WATCH**"
          },
          "id": 1,
          "transparent": true
        },
        {
          "type": "stat",
          "title": "",
          "gridPos": {
            "x": 18,
            "y": 0,
            "w": 6,
            "h": 2
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "editorMode": "code",
              "expr": "((time() - min(timestamp(kube_node_status_condition{condition=\"Ready\",status=\"true\"}))) and on() ((cluster_watch:ksm_healthy:bool == 1) and on() (time() - timestamp(cluster_watch:ksm_healthy:bool) < 120)) and on() (count(kube_node_status_condition{condition=\"Ready\",status=\"true\"}) == 4) and on() ((time() - min(timestamp(kube_node_status_condition{condition=\"Ready\",status=\"true\"})) < 120))) or vector(-1)",
              "legendFormat": "更新",
              "refId": "A",
              "range": false,
              "instant": true,
              "format": "time_series"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "noValue": "◇ 未取得",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "gray",
                    "value": null
                  },
                  {
                    "color": "text",
                    "value": 0
                  },
                  {
                    "color": "orange",
                    "value": 90
                  }
                ]
              },
              "unit": "suffix:秒前",
              "decimals": 0,
              "mappings": [
                {
                  "type": "value",
                  "options": {
                    "-1": {
                      "text": "? 観測不明",
                      "color": "gray"
                    }
                  }
                }
              ]
            },
            "overrides": []
          },
          "options": {
            "colorMode": "value",
            "graphMode": "none",
            "textMode": "value_and_name",
            "justifyMode": "auto",
            "reduceOptions": {
              "calcs": [
                "last"
              ],
              "values": false
            },
            "text": {
              "valueSize": 18,
              "titleSize": 12
            },
            "orientation": "horizontal",
            "wideLayout": true
          },
          "description": "Kubernetesの状態収集元 kube-state-metrics（KSM）が取得したNode Ready情報の経過時間。全てのパネルの更新時刻を保証するものではない。",
          "id": 2,
          "transparent": true
        },
        {
          "type": "timeseries",
          "title": "master",
          "gridPos": {
            "x": 0,
            "y": 2,
            "w": 6,
            "h": 8
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "editorMode": "code",
              "expr": "((avg(100 * (1 - avg by(instance)(rate(node_cpu_seconds_total{mode=\"idle\"}[5m]))) * on(instance) group_left(nodename) node_uname_info{nodename=\"master\"})) and on() ((cluster_watch:ksm_healthy:bool == 1) and on() (time() - timestamp(cluster_watch:ksm_healthy:bool) < 120)) and on() (count(kube_node_status_capacity{node=\"master\",resource=\"cpu\",unit=\"core\"}) == 1) and on() ((time() - min(timestamp(kube_node_status_capacity{node=\"master\",resource=\"cpu\",unit=\"core\"})) < 120)) and on() (max(kube_node_status_capacity{node=\"master\",resource=\"cpu\",unit=\"core\"}) > 0) and on() (count(node_cpu_seconds_total{mode=\"idle\"} * on(instance) group_left(nodename) node_uname_info{nodename=\"master\"}) == scalar(max(kube_node_status_capacity{node=\"master\",resource=\"cpu\",unit=\"core\"}))) and on() (count(rate(node_cpu_seconds_total{mode=\"idle\"}[5m]) * on(instance) group_left(nodename) node_uname_info{nodename=\"master\"}) == scalar(max(kube_node_status_capacity{node=\"master\",resource=\"cpu\",unit=\"core\"}))) and on() ((time() - min(timestamp(node_cpu_seconds_total{mode=\"idle\"}) * on(instance) group_left(nodename) node_uname_info{nodename=\"master\"}) < 120)) and on() (count(node_uname_info{nodename=\"master\"}) == 1) and on() ((time() - min(timestamp(node_uname_info{nodename=\"master\"})) < 120)) and on() (min(up{job=\"node-exporter\"} * on(instance) group_left(nodename) node_uname_info{nodename=\"master\"}) == 1) and on() (count(up{job=\"node-exporter\"} * on(instance) group_left(nodename) node_uname_info{nodename=\"master\"}) == 1) and on() ((time() - min(timestamp(up{job=\"node-exporter\"}) * on(instance) group_left(nodename) node_uname_info{nodename=\"master\"}) < 120))) or vector(-1)",
              "legendFormat": "CPU",
              "refId": "A",
              "range": true,
              "instant": false,
              "format": "time_series"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "editorMode": "code",
              "expr": "((avg(100 * (1 - node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) * on(instance) group_left(nodename) node_uname_info{nodename=\"master\"})) and on() ((cluster_watch:ksm_healthy:bool == 1) and on() (time() - timestamp(cluster_watch:ksm_healthy:bool) < 120)) and on() (min(node_memory_MemTotal_bytes * on(instance) group_left(nodename) node_uname_info{nodename=\"master\"}) > 0) and on() (count(node_memory_MemAvailable_bytes * on(instance) group_left(nodename) node_uname_info{nodename=\"master\"}) == 1) and on() (count(node_memory_MemTotal_bytes * on(instance) group_left(nodename) node_uname_info{nodename=\"master\"}) == 1) and on() ((time() - min(timestamp(node_memory_MemAvailable_bytes) * on(instance) group_left(nodename) node_uname_info{nodename=\"master\"}) < 120)) and on() ((time() - min(timestamp(node_memory_MemTotal_bytes) * on(instance) group_left(nodename) node_uname_info{nodename=\"master\"}) < 120)) and on() (count(node_uname_info{nodename=\"master\"}) == 1) and on() ((time() - min(timestamp(node_uname_info{nodename=\"master\"})) < 120)) and on() (min(up{job=\"node-exporter\"} * on(instance) group_left(nodename) node_uname_info{nodename=\"master\"}) == 1) and on() (count(up{job=\"node-exporter\"} * on(instance) group_left(nodename) node_uname_info{nodename=\"master\"}) == 1) and on() ((time() - min(timestamp(up{job=\"node-exporter\"}) * on(instance) group_left(nodename) node_uname_info{nodename=\"master\"}) < 120))) or vector(-1)",
