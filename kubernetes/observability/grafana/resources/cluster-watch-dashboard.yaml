        {
          "id": 15,
          "title": "失敗",
          "type": "stat",
          "gridPos": {
            "x": 16,
            "y": 3,
            "w": 4,
            "h": 3
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "description": "Failed状態のPod。Jobの失敗も含む。",
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
