                  "type": "value",
                  "options": {
                    "-1": {
                      "text": "確認不能",
                      "color": "gray"
                    }
                  }
                }
              ]
            },
            "overrides": []
          },
          "options": {
            "colorMode": "value",
            "graphMode": "none",
            "textMode": "value",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "orientation": "horizontal"
          }
        },
        {
          "id": 13,
          "title": "待機",
          "type": "stat",
          "gridPos": {
            "x": 8,
            "y": 3,
            "w": 4,
            "h": 3
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "description": "Pending状態のPod。コンテナの待機理由とは別分類。",
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "(((count(max by(namespace,pod,uid)(kube_pod_status_phase{phase=\"Pending\"}==1))) or vector(0)) and on() (((cluster_watch:ksm_healthy:bool == 1) and on() (time() - timestamp(cluster_watch:ksm_healthy:bool) < 120)) and on() (count(max by(namespace,pod,uid,phase)(kube_pod_status_phase == 1)) == count(max by(namespace,pod,uid)(kube_pod_info))) and on() (time() - min(timestamp(kube_pod_status_phase)) < 120))) or vector(-1)",
              "refId": "A",
              "instant": true,
              "format": "time_series"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "noValue": "確認不能",
              "color": {
                "mode": "thresholds"
