        {
          "id": 14,
          "title": "不明",
          "type": "stat",
          "gridPos": {
            "x": 12,
            "y": 3,
            "w": 4,
            "h": 3
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "description": "Unknown状態のPod。",
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "(((count(max by(namespace,pod,uid)(kube_pod_status_phase{phase=\"Unknown\"}==1))) or vector(0)) and on() (((cluster_watch:ksm_healthy:bool == 1) and on() (time() - timestamp(cluster_watch:ksm_healthy:bool) < 120)) and on() (count(max by(namespace,pod,uid,phase)(kube_pod_status_phase == 1)) == count(max by(namespace,pod,uid)(kube_pod_info))) and on() (time() - min(timestamp(kube_pod_status_phase)) < 120))) or vector(-1)",
              "refId": "A",
