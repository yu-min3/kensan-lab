## Langfuse credentials from Vault (secret/observability/langfuse).
## Populate with bootstrap/vault/llmops-secrets.sh before the first sync.
## SALT and ENCRYPTION_KEY cannot be regenerated without losing API keys and
## encrypted columns: never rotate them in place.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: langfuse-credentials
  namespace: langfuse
spec:
  refreshInterval: 1h
  secretStoreRef: {name: vault-backend, kind: ClusterSecretStore}
  target: {name: langfuse-credentials, creationPolicy: Owner}
  dataFrom:
    - extract:
        key: observability/langfuse
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: langfuse-postgresql-auth
  namespace: langfuse
spec:
  refreshInterval: 1h
  secretStoreRef: {name: vault-backend, kind: ClusterSecretStore}
  target:
    name: langfuse-postgresql-auth
    creationPolicy: Owner
    template:
      data:
        POSTGRES_USER: postgres
        POSTGRES_PASSWORD: "{{ .admin }}"
        USERDB_USER: langfuse
        USERDB_PASSWORD: "{{ .user }}"
        POSTGRES_DB: langfuse
  data:
    - {secretKey: admin, remoteRef: {key: observability/langfuse, property: postgres-admin-password}}
    - {secretKey: user, remoteRef: {key: observability/langfuse, property: postgres-password}}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: langfuse-redis-auth
  namespace: langfuse
spec:
  refreshInterval: 1h
  secretStoreRef: {name: vault-backend, kind: ClusterSecretStore}
  target: {name: langfuse-redis-auth, creationPolicy: Owner}
  data:
    - {secretKey: default, remoteRef: {key: observability/langfuse, property: redis-password}}
---
## SeaweedFS reads its IAM identities from seaweedfs_s3_config; Langfuse reads
## accessKey/secretKey. Same shape the chart would generate.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: langfuse-s3-auth
  namespace: langfuse
spec:
  refreshInterval: 1h
  secretStoreRef: {name: vault-backend, kind: ClusterSecretStore}
  target:
    name: langfuse-s3-auth
    creationPolicy: Owner
    template:
      data:
        accessKey: langfuse
        secretKey: "{{ .s3 }}"
        seaweedfs_s3_config: '{"identities":[{"name":"langfuse","credentials":[{"accessKey":"langfuse","secretKey":"{{ .s3 }}"}],"actions":["Admin","Read","Write","List","Tagging"]}]}'
  data:
    - {secretKey: s3, remoteRef: {key: observability/langfuse, property: s3-password}}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: langfuse-clickhouse
  namespace: langfuse
spec:
  refreshInterval: 1h
  secretStoreRef: {name: vault-backend, kind: ClusterSecretStore}
  target: {name: langfuse-clickhouse, creationPolicy: Owner}
  data:
    - {secretKey: password, remoteRef: {key: observability/langfuse, property: clickhouse-password}}
