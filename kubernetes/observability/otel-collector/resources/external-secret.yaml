## Collector credentials from Vault (bootstrap/vault/llmops-secrets.sh).
##   OTLP_EXTERNAL_TOKEN : bearer token for the otlp/external receiver (LAN senders)
##   LANGFUSE_KONRO_AUTH : base64("pk:sk") of the Langfuse konro project
## The Langfuse keys are read from the same Vault entry Langfuse initializes
## from, so the two cannot drift.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: otel-collector-credentials
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef: {name: vault-backend, kind: ClusterSecretStore}
  target:
    name: otel-collector-credentials
    creationPolicy: Owner
    template:
      data:
        OTLP_EXTERNAL_TOKEN: "{{ .token }}"
        LANGFUSE_KONRO_AUTH: '{{ printf "%s:%s" .pk .sk | b64enc }}'
  data:
    - {secretKey: token, remoteRef: {key: observability/otel-collector, property: otlp-external-token}}
    - {secretKey: pk, remoteRef: {key: observability/langfuse, property: konro-public-key}}
    - {secretKey: sk, remoteRef: {key: observability/langfuse, property: konro-secret-key}}
