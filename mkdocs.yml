site_name: kensan-lab
site_description: Enterprise-grade Kubernetes on bare-metal — a reference architecture for platform engineering.
site_url: https://yu-min3.github.io/kensan-lab/
repo_url: https://github.com/yu-min3/kensan-lab
repo_name: yu-min3/kensan-lab
edit_uri: edit/main/docs/
copyright: Copyright &copy; yu-min3

docs_dir: docs

exclude_docs: |
  bootstrapping/scripts/

validation:
  nav:
    omitted_files: warn
    not_found: warn
    absolute_links: warn
  links:
    not_found: warn
    anchors: warn
    absolute_links: ignore
    unrecognized_links: ignore

theme:
  name: material
  language: en
  logo: assets/kensan-logo-dark.svg
  favicon: assets/kensan-logo-dark.svg
  font:
    text: Inter
    code: JetBrains Mono
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    # Top-level sections become tabs in the header, so the sidebar only ever
    # shows the section you are in. Without this, all of Architecture — the 22
    # ADRs included — sits in one column next to every other section.
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    # "View source", not "Edit this page": the site is published as a reference,
    # and pull requests are not being solicited. The link is still built from
    # edit_uri above — dropping that setting would remove this button too.
    - content.action.view
    - content.tabs.link

plugins:
  - search
  # The 2026-09 nav restructure renamed docs/ directories to match the sections
  # a reader sees (concepts/ and guides/ stopped corresponding to anything).
  # These pages are linked from published articles, so the old URLs keep working.
  - redirects:
      redirect_maps:
        concepts/doc-layout.md: reference/doc-layout.md
        concepts/namespace-label-design.md: architecture/namespace-label-design.md
        concepts/network-policy-guide.md: architecture/network-policy-guide.md
        concepts/policy-enforcement.md: architecture/policy-enforcement.md
        guides/backstage-golden-path.md: architecture/backstage-golden-path.md
        guides/observability-integration.md: runbooks/observability-integration.md
        guides/wifi-stabilization.md: runbooks/wifi-stabilization.md
        operations/kensan-workspace-volume-recovery.md: recovery/kensan-workspace-volume-recovery.md
        operations/syncthing-pairing-recovery.md: recovery/syncthing-pairing-recovery.md
        bootstrapping/11-grafana-independent.md: bootstrapping/grafana-independent.md
        bootstrapping/12-vault-stage1.md: bootstrapping/vault-stage1.md
  - glightbox:
      touchNavigation: true
      loop: false
      effect: fade
      slide_effect: slide
      zoomable: true
      draggable: true
  - git-revision-date-localized:
      enable_creation_date: true
      type: timeago
      fallback_to_build_date: true
  # AI-facing output: generates /llms.txt (curated index) and /llms-full.txt
  # (full content) from the same human docs at build time. No content duplication.
  # https://llmstxt.org/ · https://github.com/pawamoy/mkdocs-llmstxt
  - llmstxt:
      full_output: llms-full.txt
      markdown_description: >-
        Enterprise-grade Kubernetes on bare-metal — a reference architecture for
        platform engineering. Argo CD GitOps, Istio service mesh, Cilium CNI,
        Vault, Keycloak, Backstage, and full observability (Prometheus, Grafana,
        Loki, Tempo), running on Raspberry Pis and a mini PC.
      sections:
        Overview:
          - index.md
          - showcase.md
        Try it in one command:
          - getting-started/try-it-with-kind.md
          - getting-started/kind-explained.md
        Architecture:
          - architecture/*.md
        Auth & secrets:
          - auth/*.md
          - secret-management/*.md
        Architecture decisions:
          - adr/*.md
        Bare-metal bootstrap:
          - getting-started/installation.md
          - getting-started/configuration.md
          - bootstrapping/*.md
        Operations:
          - runbooks/*.md
          - recovery/*.md
          - incidents/*.md
        Reference:
          - reference/*.md
          - design/*.md
          - roadmap/*.md
          - articles.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - footnotes
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      base_path: ["."]
      check_paths: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/yu-min3/kensan-lab
  generator: false

extra_css:
  - stylesheets/whetstone.css

